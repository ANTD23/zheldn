function openPicker(title,cb){ SHEET={}; const st={sel:[],cb,q:'',g:''}; openSheet(`<div class="sheet-h"><h2>${esc(title)}</h2><button class="btn primary sm" data-a="pickDone">Добавить</button></div><input class="in" id="pickQ" data-in="pickQ" placeholder="Поиск"><div class="chips" id="pickG"></div><div class="list" id="pickList"></div>`,st); renderPick(); }
function renderPick(){ const st=SHEET; const q=st.q.toLowerCase();
  $('#pickG').innerHTML=`<button class="chip ${!st.g?'on':''}" data-a="pickG" data-k="">Все</button>`+GROUPS.map(g=>`<button class="chip ${st.g===g?'on':''}" data-a="pickG" data-k="${g}">${g}</button>`).join('');
  const list=S.exercises.filter(x=>(!st.g||x.group===st.g)&&(!q||x.name.toLowerCase().includes(q))).sort((a,c)=>a.name.localeCompare(c.name,'ru'));
  $('#pickList').innerHTML=list.map(x=>{ const on=st.sel.includes(x.id); return `<button class="li" data-a="pickT" data-id="${x.id}" aria-pressed="${on}"><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${x.group} · ${EQUIP[x.equip]}</div></div><span class="chk" style="width:36px;height:36px;${on?'background:var(--accent);border-color:var(--accent);color:var(--accent-ink)':''}">${on?IC.check:''}</span></button>`; }).join('')||'<p class="muted">Ничего не найдено</p>';
  const btn=document.querySelector('[data-a="pickDone"]'); if(btn) btn.textContent=st.sel.length?`Добавить (${st.sel.length})`:'Добавить'; }

function ctx(el){ const a=el.closest('[data-ei]'), b=el.closest('[data-si]'); const ei=a?+a.dataset.ei:null, si=b?+b.dataset.si:null; const e=(ei!=null&&ACT)?ACT.entries[ei]:null; return {ei,si,e,s:e&&si!=null?e.sets[si]:null}; }
function startWorkout(tid){
  if(ACT){ setTab('train'); return; }
  const gym=gymOf(S.gymId), t=tid?S.templates.find(x=>x.id===tid):null;
  ACT={id:uid(),start:Date.now(),gymId:gym.id,gymName:gym.name,tplId:t?t.id:null,name:t?t.name:'Свободная тренировка',entries:t?t.items.filter(i=>exById(i.exId)).map(i=>buildEntry(exById(i.exId),gym,i.pre)):[],note:'',timer:null,lu:Date.now()};
  audio(); wakeOn(); hrAuto(); saveActive(true); UI.tab='train'; UI.view=null; UI.stack=[]; render(); window.scrollTo(0,0);
}
function finishWorkout(){
  const prev=fin();
  const s={id:ACT.id,start:ACT.start,end:Date.now(),gymId:ACT.gymId,gymName:gymOf(ACT.gymId).name,tplId:ACT.tplId,name:ACT.name,note:ACT.note,
    entries:ACT.entries.map(e=>({exId:e.exId,name:e.name,equip:e.equip,group:e.group,two:e.two,bw:e.bw,note:e.note,sets:e.sets.filter(x=>x.done&&x.w!=null).map(x=>x.hr?{k:x.k,w:x.w,r:x.r,hr:x.hr}:{k:x.k,w:x.w,r:x.r})})).filter(e=>e.sets.length)};
  { const hs=hrSummary(ACT.hr); if(hs) s.hr=hs; }
  s.prs=[]; s.entries.forEach(e=>{ const h=exHistory(e.exId,prev); if(!h.length) return; const cur=entryE1(e), best=Math.max(...h.map(x=>x.e1)); if(cur>best+0.05) s.prs.push({t:'1ПМ',name:e.name,from:best,to:cur});
    const ws=e.sets.filter(x=>x.k==='w'); const topW=Math.max(...ws.map(x=>x.w)), bestW=Math.max(...h.map(x=>x.topW)); if(topW>bestW+1e-9) s.prs.push({t:'Вес',name:e.name,from:bestW,to:topW}); });
  if(!s.entries.length){ ACT=null; saveActive(true); wakeOff(); closeSheet(); toast('Нет выполненных подходов — тренировка не сохранена'); setTab('train'); return; }
  SESS.push(s); saveSession(s);
  { const t=S.templates.find(x=>x.id===ACT.tplId); if(t){ const done=new Set(s.entries.map(e=>e.exId)); t.items.forEach(it=>{ if(it.pre&&done.has(it.exId)) it.pre=null; }); } }
  if(ACT.tplId){ const i=S.templates.findIndex(t=>t.id===ACT.tplId); if(i>=0) S.nextTpl=S.templates[(i+1)%S.templates.length].id; }
  ACT=null; saveActive(true); saveState(); wakeOff(); closeSheet();
  UI.tab='hist'; UI.view='session'; UI.id=s.id; UI.stack=[]; UI.fresh=s.id; render(); window.scrollTo(0,0);
}
function wStep(e,s,dir){ const list=options(exOf(e),gymOf(ACT.gymId)); if(s.w==null){ s.w=list.length?list[Math.min(list.length-1,Math.floor(list.length/6))]:20; } else s.w=dir>0?upW(list,s.w):downW(list,s.w); }

  ctStart:()=>{ audio(); tmStart(cs().timer,'Таймер',false); render(); },
  ctAdj:el=>{ const c=cs(); c.timer=Math.max(30,Math.min(3600,c.timer+(+el.dataset.d))); saveState(); render(); },
  ctAdd:el=>{ const t=CAR.tm; if(!t) return; const d=+el.dataset.d*1000; if(t.paused!=null) t.paused=Math.max(1000,t.paused+d); else { t.end=Math.max(Date.now()+1000,t.end+d); if(t.end-Date.now()>10000) t.pre=false; } t.total=Math.max(1,t.total+d/1000); persist(); render(); },
  ctPause:()=>{ const t=CAR.tm; if(!t) return; t.paused=tmLeft(); persist(); render(); },
  ctResume:()=>{ const t=CAR.tm; if(!t) return; t.end=Date.now()+t.paused; t.paused=null; persist(); render(); },
  ctReset:()=>{ const w=CAR.tm&&CAR.tm.warm; CAR.tm=null; if(w) cardioReset(); persist(); render(); },
  cWarm:el=>{ const c=cs(); c.warm=Math.max(0,Math.min(1800,c.warm+(+el.dataset.d))); saveState(); render(); },
  cStop:()=>{ const r=CAR.rec; if(!r) return; const h=hrSummary({s:r.s});
    const s={id:r.id,kind:'cardio',start:r.start,end:Date.now(),gymId:S.gymId,gymName:gymOf(S.gymId).name,tplId:null,name:cs().name,note:'',entries:[],prs:[],hr:h||undefined,sprints:r.sp,thr:{hi:cs().hi,lo:cs().lo}};
    SESS.push(s); saveSession(s); CAR.rec=null; CAR.tm=null; flush(); if(!ACT) wakeOff(); UI.tab='hist'; UI.view='session'; UI.id=s.id; UI.stack=[]; UI.fresh=s.id; render(); window.scrollTo(0,0); },
  cCancel:()=>confirmSheet('Отменить тренировку?','Время и пульс этой тренировки не сохранятся.','Отменить тренировку',()=>{ CAR.rec=null; CAR.tm=null; flush(); render(); },true),
  mProf:el=>{ S.mito.active=el.dataset.id; saveState(); render(); },

  mWeek:el=>{ const p=mp(); p.week=+el.dataset.i; p.doneA=0; p.doneB=0; saveState(); render(); },

  mStart:el=>mStartRun(el.dataset.t),
  mTests:()=>mTestSheet(),
  mTestGo:()=>{ const o={fix:$('#tFix').checked,rsa:$('#tRsa').checked,max:$('#tMax').checked}; if(!o.fix&&!o.rsa&&!o.max){ toast('Выберите хотя бы один тест'); return; } mStartRun('T',o); },
  mPause:()=>{ const r=MITO.run; if(!r||r.done) return; const now=Date.now(); r.paused=r.tr?(r.tr.k==='wait'?0:Math.max(0,r.tr.end-now)):Math.max(0,r.t1-now); persist(); render(); },
  mResume:()=>{ const r=MITO.run; if(!r) return; const now=Date.now(); if(r.tr){ if(r.tr.k==='wait') r.tr.start=now; else r.tr.end=now+r.paused; } else r.t1=now+r.paused; r.paused=null; r.lastTick=null; persist(); render(); },
  mSkip:()=>{ const r=MITO.run; if(!r||r.done) return; r.paused=null; if(r.tr){ if(r.tr.k==='wait') r.waitAcc=Math.round((Date.now()-r.tr.start)/1000); mEnter(r.idx+1); return; } const s=mStep(); if(s&&(s.ph==='work'||s.ph==='steady')) mEndStep(); else mEnter(r.idx+1); },
  mMute:()=>{ MITO.run.muted=!MITO.run.muted; persist(); render(); },
  mW:el=>{ const r=MITO.run, ls=[...r.recs].reverse().find(s=>s.endT); if(!ls) return; const prev=[...r.recs].reverse().find(s=>s.w!=null); ls.w=Math.max(0,ls.w!=null?ls.w+(+el.dataset.d):(prev?prev.w:400)); persist(); render(); },
  mBurn:()=>{ const r=MITO.run, ls=[...r.recs].reverse().find(s=>s.endT); if(ls){ ls.burn=!ls.burn; persist(); render(); } },
  mEndSeries:()=>mEndSeries(),
  mAdvRep:el=>{ const p=mp(), x=SESS.find(y=>y.id===el.dataset.id); p.week=+el.dataset.w; p.doneA=0; p.doneB=0; if(x){ x.advice='repeat'; saveSession(x); } saveState(); toast('Неделя '+el.dataset.w+' — повтор'); render(); },
  mAdvKeep:el=>{ const x=SESS.find(y=>y.id===el.dataset.id); if(x){ x.advice='keep'; saveSession(x); } render(); },
  mSetMax:()=>{ const r=MITO.run, p=S.mito.profiles.find(x=>x.id===r.pid); if(p&&r.res.maxHr){ p.hrMax=r.res.maxHr; saveState(); toast('ЧСС макс. обновлена: '+r.res.maxHr); render(); } },
  mFinish:()=>mFinishSheet(),
  mSave:el=>mSave(el.dataset.c==='1'),
  mDiscard:()=>{ closeSheet(); confirmSheet('Не сохранять тренировку?','Пульс и подходы этой тренировки будут удалены.','Не сохранять',()=>{ MITO.run=null; flush(); if(!ACT) wakeOff(); render(); },true); },
  mMode:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); p.mode=el.dataset.k; saveState(); render(); },
  mN:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p), k=el.dataset.k; p[k]=Math.max(k==='nA'?1:0,Math.min(4,p[k]+(+el.dataset.d))); saveState(); render(); },
  mDelProf:el=>{ const id=el.dataset.p, p=S.mito.profiles.find(x=>x.id===id); confirmSheet('Удалить профиль?',`Профиль «${esc(p.name)}» и его настройки будут удалены. Сохранённые тренировки останутся в истории.`,'Удалить',()=>{ S.mito.profiles=S.mito.profiles.filter(x=>x.id!==id); if(S.mito.active===id) S.mito.active=S.mito.profiles[0].id; saveState(); back(); },true); },
  mplAdd:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); const l=p.plan[p.plan.length-1]||defPlan(p.age)[0]; p.plan.push({...clone(l),deload:false,tests:false}); saveState(); render(); },

  mplB:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); p.plan[+el.dataset.i].b.type=el.dataset.k; saveState(); render(); },
  mPlanAge:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); confirmSheet('Пересобрать таблицу?',`Таблица будет заменена исходными 8 неделями протокола для возраста ${p.age} (отдых ${p.age>=45?'75 и 90':'60 и 75'} с). Ваши правки в таблице пропадут.`,'Пересобрать',()=>{ p.plan=defPlan(p.age); p.week=Math.min(p.week,p.plan.length+1); saveState(); render(); }); },
  cSet:el=>{ UI.calc.w=+el.dataset.w; render(); },

  setNum:el=>{ const k=el.dataset.k, st=S.settings; st[k]=Math.min(+el.dataset.max,Math.max(+el.dataset.min,(+st[k]||0)+(+el.dataset.d))); if(st.repMax<=st.repMin) st.repMax=st.repMin+1; saveState(); render(); },

function applyTheme(){ const t=S.settings.theme; if(t==='auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=t; }

const F={
  gym:el=>{ S.gymId=el.value; saveState(); render(); },
  w:el=>{ const c=ctx(el); const v=num(el.value); if(v!=null&&v<0&&exOf(c.e).equip!=='bodyweight'){ toast('Вес не может быть отрицательным'); render(); return; } if(v!=null&&v>1000){ toast('Слишком большой вес'); render(); return; } c.s.w=v==null?null:r2(v); propagate(c.e,c.si); saveActive(); render(); },
  r:el=>{ const c=ctx(el); const v=num(el.value); c.s.r=v==null?0:Math.min(100,Math.max(0,Math.round(v))); saveActive(); render(); },
  actNote:el=>{ ACT.note=el.value; saveActive(); },
  sessNote:el=>{ const s=SESS.find(x=>x.id===UI.id); if(s){ s.note=el.value; saveSession(s); toast('Заметка сохранена'); } },
  dx:el=>{ const d=UI.draft, k=el.dataset.k; let v=el.value; if(k==='step'||k==='start'){ v=num(v); } if(k==='rest'){ v=num(v); v=v?Math.round(v):null; } if(k==='step'&&!(v>0)) v=5; d[k]=v; if(k==='equip'){ if(v==='barbell'&&!d.bar) d.bar='Олимпийский'; d.warm=v!=='bodyweight'; render(); } if(k==='machine') render(); },
  dxc:el=>{ UI.draft[el.dataset.k]=el.checked; },
  tplName:el=>{ const t=S.templates.find(x=>x.id===UI.id); t.name=el.value.trim()||t.name; saveState(); },
  gName:el=>{ const g=S.gyms.find(x=>x.id===UI.id); g.name=el.value.trim()||g.name; saveState(); render(); },
  gBar:el=>{ const g=S.gyms.find(x=>x.id===UI.id), b=g.bars[+el.dataset.i]; if(el.dataset.k==='w'){ const v=num(el.value); if(v!=null&&v>=0) b.w=v; } else b.name=el.value.trim(); saveState(); render(); },
  gPl:el=>{ const g=S.gyms.find(x=>x.id===UI.id), arr=el.dataset.l==='plates'?g.plates:g.db.plates, p=arr[+el.dataset.i]; const v=num(el.value); if(v!=null&&v>=0) p[el.dataset.k]=el.dataset.k==='n'?Math.round(v):v; saveState(); render(); },
  gDbH:el=>{ const g=S.gyms.find(x=>x.id===UI.id); const v=num(el.value); if(v!=null&&v>=0) g.db.handle=v; saveState(); render(); },
  gM:el=>{ const g=S.gyms.find(x=>x.id===UI.id), m=g.machines[+el.dataset.i], k=el.dataset.k;
    if(k==='name'){ const old=m.name, nv=el.value.trim(); if(!nv) return; m.name=nv; if(old&&old!==nv&&!S.gyms.some(x=>(x.machines||[]).some(y=>y!==m&&y.name===old))) S.exercises.forEach(e=>{ if(e.machine===old) e.machine=nv; }); }
    else { const v=num(el.value); if(v==null||v<0) return; if(k==='step'&&v<=0) return; m[k]=v; }
    saveState(); render(); },
  gKb:el=>{ const g=S.gyms.find(x=>x.id===UI.id); g.kb=el.value; saveState(); render(); },
  preW:el=>{ const v=num(el.value); SHEET.w=v==null?null:r2(v); preSheet(); },
  sHrMax:el=>{ const v=num(el.value); S.settings.hrMax=v&&v>80&&v<240?Math.round(v):null; saveState(); },
  sHrRest:el=>{ const v=num(el.value); S.settings.hrRest=v&&v>40&&v<200?Math.round(v):0; saveState(); },
  cThrIn:el=>{ const v=num(el.value); if(v&&v>=40&&v<=230){ const c=cs(); c[el.dataset.k]=Math.round(v); if(c.lo>=c.hi){ if(el.dataset.k==='hi') c.lo=c.hi-5; else c.hi=c.lo+5; } cardioReset(); saveState(); } render(); },
  cVib:el=>{ cs().vib=el.checked; saveState(); },
  mp:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p), k=el.dataset.k;
    if(k==='name'){ const v=el.value.trim(); if(v) p.name=v; }
    else { const v=num(el.value);
      if(k==='hrMax') p.hrMax=v&&v>=100&&v<=230?Math.round(v):null;
      else if(k==='age'){ if(v&&v>=8&&v<=90) p.age=Math.round(v); }
      else if(k==='hrStop'){ if(v&&v>=60&&v<=95) p.hrStop=Math.round(v); }
      else if(k==='pDrop'){ if(v&&v>=5&&v<=40) p.pDrop=Math.round(v); }
      else if(['between','warm','cool'].includes(k)){ if(v!=null&&v>=0&&v<=60) p[k]=Math.round(v*60); } }
    saveState(); render(); },
  mpc:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); p[el.dataset.k]=el.checked; saveState(); render(); },
  mpl:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p), w=p.plan[+el.dataset.i], [g,k]=el.dataset.k.split('.'); const v=num(el.value);
    const lim={'a.series':[1,8],'a.sets':[1,20],'a.work':[4,30],'a.rest':[20,300],'b.min':[10,120],'b.reps':[1,8],'b.work':[1,10],'b.rest':[1,10]}[el.dataset.k];
    if(v!=null&&v>=lim[0]&&v<=lim[1]) w[g][k]=Math.round(v); saveState(); render(); },
  mplc:el=>{ const p=S.mito.profiles.find(x=>x.id===el.dataset.p); p.plan[+el.dataset.i][el.dataset.k]=el.checked; saveState(); },
  mWin:el=>{ const r=MITO.run, ls=r&&[...r.recs].reverse().find(s=>s.endT); if(!ls) return; const v=num(el.value); ls.w=v!=null&&v>=0?Math.round(v):null; persist(); render(); },
  mWi:el=>{ const r=MITO.run, x=r&&r.recs[+el.dataset.i]; if(!x) return; const v=num(el.value); x.w=v!=null&&v>=0?Math.round(v):null; persist(); },
  mRes:el=>{ const r=MITO.run; if(!r) return; const v=num(el.value); r.res[el.dataset.k]=v!=null&&v>=0?Math.round(v):null; persist(); },
  cM:el=>{ UI.calc.m=+el.value; render(); },
  gDbF:el=>{ const g=S.gyms.find(x=>x.id===UI.id); g.db.fixed=el.value; saveState(); render(); },
  cGym:el=>{ const c=UI.calc; c.gymId=el.value; c.bar=0; const g=gymOf(c.gymId), mi=(g.machines||[]).findIndex(m=>m.type==='plate'); if(c.kind==='m'){ if(mi<0) c.kind='bar'; else c.m=mi; } render(); },
  cBar:el=>{ UI.calc.bar=+el.value; render(); },
  cTwo:el=>{ UI.calc.two=el.checked; render(); },
  cW:el=>{ const v=num(el.value); if(v!=null&&v>=0) UI.calc.w=v; render(); },
  warm:el=>{ const w=S.settings.warm[+el.dataset.i]; const v=num(el.value); if(v!=null&&v>0) w[el.dataset.k]=Math.min(el.dataset.k==='p'?100:30,Math.round(v)); saveState(); render(); },
  sBw:el=>{ const v=num(el.value); S.settings.bw=v&&v>0?v:null; saveState(); },
};
document.addEventListener('click',ev=>{ const el=ev.target.closest('[data-a]'); if(!el||el.disabled) return; const f=A[el.dataset.a]; if(f){ ev.preventDefault(); try{ f(el,ev); }catch(err){ console.error(err); toast('Не получилось выполнить действие'); } } });
document.addEventListener('change',ev=>{ const el=ev.target; const f=el.dataset&&F[el.dataset.f]; if(f){ try{ f(el); }catch(err){ console.error(err); } } });
document.addEventListener('input',ev=>{ const el=ev.target; if(el.dataset.in==='pickQ'){ SHEET.q=el.value; renderPick(); } else if(el.dataset.in==='exQ'){ UI.exQ=el.value; const q=el.value.toLowerCase(); $('#exListBox').innerHTML=exListRows(S.exercises.filter(x=>(!UI.exG||x.group===UI.exG)&&(!q||x.name.toLowerCase().includes(q))).sort((a,c)=>a.name.localeCompare(c.name,'ru'))); } });
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.matches('.stp input,.in:not(textarea)')) ev.target.blur(); if(ev.key==='Escape'&&!$('#sheet-wrap').hidden) closeSheet(); });
document.addEventListener('focusin',ev=>{ if(ev.target.matches('.stp input')) setTimeout(()=>{ try{ ev.target.select(); }catch(e){} },0); });
document.addEventListener('pointerdown',()=>{ if(AC&&AC.state==='suspended') AC.resume(); },{passive:true});

/* ---------- backup ---------- */
async function saveFile(name,data,type,mode){
  let file; try{ file=new File([data],name,{type}); }catch(e){ file=null; }
  if(file&&mode==='share'&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:name}); toast('Файл отправлен'); return true; }
    catch(e){ if(e&&e.name==='AbortError'){ toast('Отправка отменена'); return false; } }
  }
  try{ const url=URL.createObjectURL(file||new Blob([data],{type})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); toast(mode==='share'?'Отправка недоступна — файл сохранён в «Загрузки»':'Файл сохранён в «Загрузки»'); return true; }
  catch(e){}
  openSheet(`<h2>Скопируйте данные</h2><p class="muted">Сохранить файл не получилось. Скопируйте текст и сохраните его в заметку.</p><textarea class="in" id="dumpT" readonly style="min-height:180px;font-size:12px">${esc(data)}</textarea><div class="btns"><button class="btn" data-a="closeSheet">Закрыть</button><button class="btn primary" data-a="copyDump">Копировать</button></div>`);
  return false;
}
A.copyDump=()=>{ const t=$('#dumpT'); navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t.value).then(()=>toast('Скопировано'),()=>{ t.select(); toast('Выделено — скопируйте вручную'); }):(t.select(),toast('Выделено — скопируйте вручную')); };
function exportJson(mode){ const data=JSON.stringify({app:'ironlog',v:1,exported:new Date().toISOString(),state:S,sessions:SESS.filter(s=>!s.del)});
  saveFile(`dnevnik-kopiya-${todayStr()}.txt`,data,'text/plain',mode||'share').then(ok=>{ if(ok){ S.lastBackup=Date.now(); saveState(); render(); } }); }
function exportCsv(mode){ const rows=[['Дата','Тренировка','Зал','Упражнение','Группа','Подход','Вес, кг','Повторы','Тоннаж, кг','1ПМ, кг','Пульс']];
  fin().forEach(s=>s.entries.forEach(e=>{ let wi=0,ri=0; e.sets.forEach(x=>rows.push([localDay(s.start),s.name,s.gymName||'',e.name,(exById(e.exId)||e).group||'',x.k==='r'?'разминка '+(++ri):'рабочий '+(++wi),fmt(x.w),x.r,fmt(setTon(e,x),1),x.k==='w'&&x.r<=12?fmt(e1rm(loadW(e,x.w),x.r),1):'',x.hr||''])); }));
  const csv='﻿'+rows.map(r=>r.map(c=>{ c=String(c); return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c; }).join(';')).join('\r\n');
  saveFile(`trenirovki-${todayStr()}.csv`,csv,'text/csv',mode||'share'); }
$('#importFile').addEventListener('change',ev=>{ const f=ev.target.files[0]; ev.target.value=''; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(String(rd.result).replace(/^\ufeff/,'')); if(!d||!d.state||!Array.isArray(d.sessions)) throw 0;
      confirmSheet('Восстановить из копии?',`В файле ${d.sessions.length} ${plural(d.sessions.length,'тренировка','тренировки','тренировок')} от ${dfmt(d.exported||Date.now(),{day:'numeric',month:'long',year:'numeric'})}. Текущие данные будут заменены.`,'Восстановить',()=>{
        const old=SESS; S=migrate(d.state); const ids=new Set(d.sessions.map(s=>s.id)); SESS=d.sessions.map(s=>({...s,u:Date.now()}));
        old.forEach(s=>{ if(!ids.has(s.id)){ s.del=true; s.entries=[]; s.u=Date.now(); SESS.push(s); } });
        saveState(); flush(); applyTheme(); toast('Данные восстановлены'); render(); });
    }catch(e){ toast('Это не файл копии этого приложения'); } };
  rd.readAsText(f); });

/* ---------- boot ---------- */
(async function boot(){
  IDB=await idbOpen();
  let loaded=false;
  if(IDB){ const st=await idbGet('S'); if(st){ S=migrate(st); SESS=(await idbGet('SESS'))||[]; ACT=(await idbGet('ACT'))||null; { const cd=(await idbGet('CARDIO'))||null; if(cd&&cd.start){ CAR.rec=cd; } else if(cd){ CAR.rec=cd.rec||null; CAR.tm=cd.tm||null; } } { const mr=(await idbGet('MITO'))||null; MITO.run=mr&&mr.v===2?mr:null; const r=MITO.run; if(r&&!r.done&&r.paused==null) r.paused=r.tr?(r.tr.k==='wait'?0:Math.max(0,r.tr.end-Date.now())):Math.max(0,r.t1-Date.now()); } loaded=true; } }
  if(!loaded){ const L=lsGet(); if(L&&L.S){ S=migrate(L.S); SESS=L.SESS||[]; ACT=L.ACT||null; } flush(); }
  applyTheme(); render(); setInterval(tick,250);
  if(ACT) wakeOn();
  askPersist().then(()=>{ if(UI.tab==='more'||UI.view==='backup') render(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
