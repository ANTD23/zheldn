<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Железный дневник</title>
<meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600&family=Fira+Sans+Extra+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: single phone column, sticky header, bottom tab bar, rest timer docked above the tab bar. Steel neutrals, plate-yellow accent, IWF plate colours as content. */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface2:#e1e5ea; --fg:#13171c; --muted:#58616c; --line:#d0d6dd;
  --accent:#e2a500; --accent-ink:#1d1500; --accent-text:#8a6200; --accent-soft:#f5e6b6;
  --good:#1f8148; --good-soft:#d6eedf; --bad:#c43a3a; --bad-soft:#f6dcdc;
  --scrim:rgba(10,12,16,.5); --shadow:0 1px 2px rgba(20,24,30,.07),0 3px 12px rgba(20,24,30,.05);
  --p-red:#d23a2f; --p-blue:#2f5fb8; --p-yellow:#e8b417; --p-green:#2c8a4d; --p-white:#f3f3f1; --p-chrome:#c4c9d0; --p-grey:#6b7380; --p-ink:#1a1a1a; --p-light:#ffffff;
  --f-body:"Fira Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"Fira Sans Extra Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101216; --surface:#191c21; --surface2:#242830; --fg:#eef0f3; --muted:#99a1ac; --line:#2c3139;
  --accent:#f2c230; --accent-ink:#1d1500; --accent-text:#f2c230; --accent-soft:#3a3013;
  --good:#4cc47f; --good-soft:#15301f; --bad:#ff6b6b; --bad-soft:#3a1c1c;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191c21; --surface2:#242830; --fg:#eef0f3; --muted:#99a1ac; --line:#2c3139;
  --accent:#f2c230; --accent-ink:#1d1500; --accent-text:#f2c230; --accent-soft:#3a3013;
  --good:#4cc47f; --good-soft:#15301f; --bad:#ff6b6b; --bad-soft:#3a1c1c;
  --scrim:rgba(0,0,0,.6); --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
body.has-timer{padding-bottom:calc(84px + 200px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#app{max-width:600px;margin:0 auto}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px 8px}
main{display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{font:600 27px/1.1 var(--f-num);margin:0;text-wrap:balance;letter-spacing:.005em}
h2{font:600 21px/1.15 var(--f-num);margin:0;text-wrap:balance}
h3{font:600 17px/1.2 var(--f-body);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

.hd{display:flex;align-items:center;gap:8px;min-height:50px}
.hd-t{flex:1;min-width:0}
.hd-sub{color:var(--muted);font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.ib{width:44px;height:44px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:12px;color:var(--fg)}
.ib:active{background:var(--surface2)}
.ib svg{width:24px;height:24px}

.card{width:100%;background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{min-height:48px;border-radius:12px;border:0;font-weight:600;font-size:16px;padding:0 16px;background:var(--surface2);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active{filter:brightness(.94)}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.big{min-height:58px;font-size:18px}
.btn.sm{min-height:40px;font-size:15px;padding:0 12px}
.btn.ghost{background:transparent;color:var(--accent-text);padding:0 8px}
.btn.danger{color:var(--bad)}
.btn.outline{background:transparent;border:1.5px solid var(--line)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.in{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);padding:0 12px;font:16px var(--f-body)}
textarea.in{padding:10px 12px;min-height:80px;resize:vertical;line-height:1.4}
select.in{appearance:auto}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:14px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}

.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:40px;border:0;background:none;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted);padding:0 6px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;min-height:36px;border-radius:18px;border:1.5px solid var(--line);background:transparent;padding:0 14px;font-size:14px;font-weight:500;color:var(--fg)}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}

.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;min-height:58px}
.li:last-child{border-bottom:0}
.li .t{font-weight:500}
.li .s{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.li .chev{color:var(--muted);flex:none}
.card.li{flex-direction:row;align-items:center}
.badge{display:inline-flex;align-items:center;min-height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.acc{background:var(--accent-soft);color:var(--accent-text)}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}

.banner{background:var(--accent-soft);color:var(--fg);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.banner .btn{flex:none}

/* home */
.next{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);border:2px solid var(--accent)}
.next h2{font-size:30px}
.plan-l{display:flex;flex-direction:column}
.plan-l>.prow{width:100%;border:0;background:none;text-align:left;color:var(--fg);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);min-height:44px}
.plan-l>.prow:last-child{border-bottom:0}
.plan-l>.prow:active{background:var(--surface2)}
.plan-l>div{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.plan-l>div:last-child{border-bottom:0}
.plan-l>div>span{min-width:0}.plan-l>div>b{white-space:normal;text-align:right;min-width:0}
.plan-l b{font-family:var(--f-num);font-size:18px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.arrow-up{color:var(--good)} .arrow-down{color:var(--bad)}

/* workout */
.wl{border:0;background:var(--surface2);border-radius:10px;padding:2px 8px;font-size:13px;min-height:26px;color:var(--muted)}
.wl.on{background:var(--good-soft);color:var(--good)}
.wl.off{background:var(--bad-soft);color:var(--bad)}
.clocks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.clk{background:var(--surface);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.clk span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clk b{font:700 46px/1.05 var(--f-num)}
.clk.run{outline:2px solid var(--accent);outline-offset:-2px}
.clk.end{background:var(--accent);color:var(--accent-ink)}.clk.end span{color:var(--accent-ink)}
.tmctl{display:flex;gap:6px}
.tmctl button{flex:1;min-height:48px;border:0;border-radius:12px;background:var(--surface2);font:600 17px var(--f-num);color:var(--fg)}
.tmctl .go{flex:2;background:var(--fg);color:var(--bg);font-family:var(--f-body);font-size:15px}
.mph{border-radius:24px;padding:14px 16px 16px;text-align:center;background:var(--surface2);color:var(--fg);display:flex;flex-direction:column;gap:2px}
.mph.work{background:var(--p-red);color:#fff}.mph.ready,.mph.wait{background:var(--accent);color:var(--accent-ink)}.mph.rest{background:var(--p-blue);color:#fff}.mph.between{background:var(--p-green);color:#fff}.mph.done{background:var(--good-soft)}
.mlbl{font:600 22px/1.2 var(--f-num)}.mhint{font-size:15px;opacity:.9}
.mph.steady.in{background:var(--p-green);color:#fff}.mph.steady.hi{background:var(--p-red);color:#fff}.mph.steady.lo{background:var(--p-blue);color:#fff}
.wgrid,.plg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.plg .field span,.wgrid .field span{font-size:12px}.mbig{font:700 112px/1 var(--f-num);letter-spacing:-.02em}.mprog{font-size:15px;opacity:.9}
.mhr{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.mhr>div{background:var(--surface);border-radius:16px;padding:8px 12px;display:flex;flex-direction:column;box-shadow:var(--shadow);min-width:0}
.mhr b{white-space:nowrap}.mhr>div:not(:first-child) b{font-size:28px}
.mhr span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mhr b{font:700 34px/1.1 var(--f-num)}.mhr>div:first-child b{font-size:46px}
.plrow{display:grid;grid-template-columns:34px repeat(3,minmax(0,1fr)) 44px 40px;gap:6px;align-items:center}
.plh{font-size:12px;color:var(--muted)}.pin{text-align:center;padding:0 4px;min-height:44px}
.cbig{border-radius:24px;padding:18px 16px 16px;text-align:center;background:var(--surface2);color:var(--fg);display:flex;flex-direction:column;gap:2px;transition:background .3s}
.cbig.hi{background:var(--p-red);color:#fff}.cbig.lo{background:var(--p-blue);color:#fff}.cbig.mid{background:var(--accent);color:var(--accent-ink)}
.cbpm{font:700 128px/1 var(--f-num);letter-spacing:-.02em}
.clbl{font:600 22px/1.2 var(--f-num)}.csub{font-size:15px;opacity:.85;min-height:20px}
.bell{border:1.5px solid var(--line);background:transparent;border-radius:12px;min-height:40px;padding:0 10px;font-size:14px;color:var(--muted);white-space:nowrap}
.bell.on{border-color:var(--accent);color:var(--fg);background:var(--accent-soft)}
.sprint.pre{background:var(--accent);color:var(--accent-ink)}.sprint.go{background:var(--p-red);color:#fff;font-size:24px}
.hr{border:0;background:var(--surface2);border-radius:10px;padding:2px 8px;font-size:13px;min-height:26px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.hr.on{color:var(--fg)}
.hr.on b{font:600 17px var(--f-num)}
.hr .heart{color:var(--zc)}
.hr.warn{color:var(--bad);background:var(--bad-soft)}
@media (prefers-reduced-motion:no-preference){.hr.on .heart{animation:beat 1s ease-in-out infinite}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}}
.ex{padding:12px;gap:8px}
.ex.fin{opacity:.8}
.ex-h{display:flex;align-items:center;gap:4px}
.ex-t{flex:1;min-width:0;border:0;background:none;text-align:left;padding:4px 0;display:flex;flex-direction:column;gap:2px}
.ex-n{font:600 20px/1.15 var(--f-num)}
.ex-m{font-size:13px;color:var(--muted)}
.plan{font-size:14px;padding:7px 10px;border-radius:10px;background:var(--surface2)}
.plan.up{background:var(--good-soft);color:var(--good)}
.plan.down{background:var(--bad-soft);color:var(--bad)}
.last{font-size:14px;color:var(--muted)}
.last b{color:var(--fg);font-weight:500}
.sets-h{display:grid;grid-template-columns:26px minmax(0,1.2fr) minmax(0,1fr) 48px;gap:6px;font-size:12px;color:var(--muted);padding:0 2px}
.sets-h span{text-align:center}
.set{display:grid;grid-template-columns:26px minmax(0,1.2fr) minmax(0,1fr) 48px;gap:6px;align-items:center;padding:4px 2px;border-radius:12px}
.set.done{background:var(--good-soft)}
.set-l{font:600 17px var(--f-num);text-align:center;color:var(--fg);border:0;background:none;padding:0;height:48px;border-radius:10px;text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.set-l:active{background:var(--surface2)}
.set.r .set-l{color:var(--muted);font-size:14px}
.stp{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;height:48px;background:var(--surface2);border-radius:12px;overflow:hidden}
.set.done .stp{background:var(--surface)}
.stp button{border:0;background:none;font-size:24px;line-height:1;font-weight:500;color:var(--fg)}
.stp button:active{background:var(--line)}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font:600 22px var(--f-num);color:var(--fg);font-variant-numeric:tabular-nums;padding:0}
.chk{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.chk svg{width:26px;height:26px}
.set.done .chk{background:var(--good);border-color:var(--good);color:var(--surface)}
.pl-line{display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:0 2px 4px 34px;border:0;background:none;text-align:left;font-size:13px;min-height:28px;width:100%}
.pl{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;font:600 13px var(--f-num);font-style:normal;background:var(--pc);color:var(--pt);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.warn{color:var(--bad);font-weight:500}
.exc{border:0;background:none;padding:4px;border-radius:8px;min-width:44px;min-height:40px;display:grid;place-items:center}
.exc .pl{height:28px;min-width:40px;font-size:15px}
.exc.off .pl{opacity:.35;text-decoration:line-through;text-decoration-thickness:2px}
.exc.off{outline:1.5px dashed var(--muted);outline-offset:-2px}
.ex-f{display:flex;gap:6px;flex-wrap:wrap}
.ex-f .btn{flex:1}
.exnote{font-size:14px;background:var(--surface2);border-radius:10px;padding:8px 10px;white-space:pre-wrap}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:7;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tm{max-width:600px;margin:0 auto;background:var(--surface);border:1.5px solid var(--line);border-radius:20px 20px 0 0;padding:10px 14px 12px;box-shadow:0 -6px 24px rgba(0,0,0,.14);display:flex;flex-direction:column;gap:6px}
.tm-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);gap:8px}
#tmLabel{flex:1;min-width:0} #tmHr{white-space:nowrap}
.tm-main{display:grid;grid-template-columns:64px 1fr 64px;align-items:center}
.tm-time{font:700 66px/1 var(--f-num);text-align:center;font-variant-numeric:tabular-nums}
.tm-b{height:52px;border-radius:14px;border:0;background:var(--surface2);font:600 19px var(--f-num)}
.tm-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.tm-bar i{display:block;height:100%;background:var(--accent);width:100%}
.tm.end{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tm.end .tm-top{color:var(--accent-ink)}
.tm.end .tm-b{background:rgba(0,0,0,.12);color:var(--accent-ink)}
.tm.end .tm-bar{background:rgba(0,0,0,.12)}
.tm.end .btn.primary{background:var(--accent-ink);color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.tm.end{animation:pulse 1s ease-in-out infinite alternate}}
@keyframes pulse{from{filter:brightness(1)}to{filter:brightness(1.12)}}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.nav-in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:64px}
.nav-in button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.nav-in button svg{width:24px;height:24px}
.nav-in button.on{color:var(--fg)}
.nav-in button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav-in .dot{position:absolute;top:10px;right:calc(50% - 18px);width:9px;height:9px;border-radius:50%;background:var(--good)}

/* sheet */
#sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.backdrop{position:absolute;inset:0;background:var(--scrim);border:0}
.sheet{position:relative;max-width:600px;width:100%;margin:0 auto;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 2px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);text-align:center}
body.has-timer #toast{bottom:calc(290px + env(safe-area-inset-bottom,0px))}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);min-width:0}
.tile b{font:600 24px/1.1 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .v{fill:var(--fg);font:600 13px var(--f-num)}
.hbar{display:grid;grid-template-columns:92px 1fr 34px;gap:8px;align-items:center;font-size:14px}
.hbar i{display:block;height:12px;border-radius:6px;background:var(--accent);min-width:3px}
.hbar b{font:600 15px var(--f-num);text-align:right}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.rec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:4px}
.rec div{background:var(--surface2);border-radius:10px;padding:6px 8px;font-size:12px;color:var(--muted)}
.rec b{display:block;color:var(--fg);font:600 18px var(--f-num)}
.empty{text-align:center;padding:28px 12px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h3{color:var(--fg)}
.pr{display:flex;gap:10px;align-items:center;font-size:15px}
.pr b{font-family:var(--f-num);font-size:18px}

.mini-row.two{grid-template-columns:minmax(0,1fr) 92px 40px}
.sum{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.diagram{background:var(--surface2);border-radius:14px;padding:8px}
html{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
img{max-width:100%}
.upd{position:fixed;left:0;right:0;top:calc(8px + env(safe-area-inset-top,0px));z-index:40;display:flex;justify-content:center;padding:0 16px}
@media (max-width:390px){.mhr>div:not(:first-child) b{font-size:22px}.mhr>div:first-child b{font-size:40px}.ex{padding:10px}.set,.sets-h{grid-template-columns:22px minmax(0,1.25fr) minmax(0,1fr) 44px;gap:4px}.set .stp{grid-template-columns:28px minmax(0,1fr) 28px}.set .stp input{font-size:20px}.set .stp button{font-size:21px}.chk{width:44px;height:44px}.pl-line{padding-left:26px}.tile b{font-size:21px}}

<script>
/*PURE*/
const r2=x=>Math.round(x*100)/100;
function e1rm(w,r){ if(!(w>0)||!(r>0)) return 0; if(r===1) return w; const ep=w*(1+r/30); const br=r<37? w*36/(37-r):ep; return (ep+br)/2; }
function wFor(orm,r){ if(r<=1) return orm; const ep=orm/(1+r/30), br=orm*(37-r)/36; return (ep+br)/2; }
const PS=new Map();
function plateSums(plates,div){
  const merged=[];
  (plates||[]).forEach(p=>{const w=+p.w,k=Math.floor((+p.n||0)/div); if(!(w>0)||!(k>0)) return; const m=merged.find(x=>Math.abs(x.w-w)<1e-9); if(m) m.k+=k; else merged.push({w,k});});
  merged.sort((a,b)=>b.w-a.w);
  const key=merged.map(t=>t.w+'x'+t.k).join('|');
  if(PS.has(key)) return PS.get(key);
  let m=new Map([[0,{c:merged.map(()=>0),n:0}]]);
  merged.forEach((t,i)=>{ const u=Math.round(t.w*100); const nm=new Map(m);
    for(const [s,v] of m){ for(let k=1;k<=t.k;k++){ const s2=s+k*u,n2=v.n+k; const ex=nm.get(s2); if(!ex||n2<ex.n){ const c=v.c.slice(); c[i]=k; nm.set(s2,{c,n:n2}); } } }
    m=nm; });
  const res={types:merged,m}; PS.set(key,res); return res;
}
function expandPlates(res,u){ const v=res.m.get(u); if(!v) return null; const out=[]; res.types.forEach((t,i)=>{for(let k=0;k<v.c[i];k++) out.push(t.w)}); return out; }
function parseList(s){ return [...new Set(String(s||'').replace(/(\d),(\d)/g,'$1.$2').split(/[^0-9.]+/).map(parseFloat).filter(v=>v>0))].sort((a,b)=>a-b); }
function floorW(list,w){ if(w==null||isNaN(w)) return null; if(!list.length) return w; let b=list[0]; for(const v of list){ if(v<=w+1e-9) b=v; else break; } return b; }
function upW(list,w){ for(const v of list) if(v>w+1e-9) return v; return list.length?list[list.length-1]:w; }
function downW(list,w){ let b=list.length?list[0]:w; for(const v of list){ if(v<w-1e-9) b=v; else break; } return b; }
/* Double progression: returns {W,kind,reps} from last working sets */
function progress(list,ws,st,load,unload){
  const nW=st.workSets;
  const lw=Math.max(...ws.map(x=>x.w)); const top=ws.filter(x=>Math.abs(x.w-lw)<1e-9); const minR=Math.min(...top.map(x=>x.r));
  if(top.length>=nW && minR>=st.repMax){ const orm=e1rm(load(lw),minR); let W=floorW(list,unload(wFor(orm,st.repMin))); if(W<=lw+1e-9) W=upW(list,lw); return {W,kind:'up',lw,reps:Array(nW).fill(st.repMin),orm}; }
  if(minR<st.repMin){ return {W:downW(list,lw),kind:'down',lw,reps:Array(nW).fill(st.repMin)}; }
  return {W:floorW(list,lw),kind:'keep',lw,reps:Array.from({length:nW},(_,i)=>top[i]?top[i].r:minR)};
}
/*END PURE*/

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(w,d=2)=>{ if(w==null||isNaN(w)) return '—'; const p=Math.pow(10,d); return String(Math.round(w*p)/p).replace('.',','); };
const num=s=>{ const v=parseFloat(String(s??'').replace(/\s/g,'').replace(',','.')); return isNaN(v)?null:v; };
const pad=n=>String(n).padStart(2,'0');
const fmtSec=s=>{ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+pad(s%60); };
const fmtDur=ms=>{ const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60); return h? h+':'+pad(m)+':'+pad(s%60) : m+':'+pad(s%60); };
const durTxt=ms=>{ const m=Math.round(ms/60000); return m>=60? Math.floor(m/60)+' ч '+(m%60)+' мин' : m+' мин'; };
const ton=t=> t>=10000? fmt(t/1000,1)+' т' : Math.round(t).toLocaleString('ru-RU')+' кг';
const dfmt=(ts,o)=>new Date(ts).toLocaleDateString('ru-RU',o||{day:'numeric',month:'short'});
const localDay=ts=>{const d=new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
const todayStr=()=>localDay(Date.now());
const monday=ts=>{const d=new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7)); return d.getTime();};
const plural=(n,a,b,c)=>{const m10=n%10,m100=n%100; return m10===1&&m100!==11?a:(m10>=2&&m10<=4&&(m100<10||m100>=20)?b:c);};

/* ---------- seed data ---------- */
const GROUPS=['Грудь','Спина','Ноги','Ягодицы','Плечи','Бицепс','Трицепс','Предплечья','Икры','Пресс'];
const EQUIP={barbell:'Штанга',dumbbell:'Гантели',machine:'Тренажёр',kettlebell:'Гиря',bodyweight:'Свой вес'};
const MTYPE={stack:'С плитками',plate:'Под блины'};
const DEF_SETTINGS={theme:'auto',signal:'both',pre:10,restWarm:0,restAfterWarm:180,restWork:180,restNext:180,backupDays:7,hrMax:null,hrRest:0,cardio:{name:'Аэробайк',hi:150,lo:110,sigHi:true,sigLo:true,vib:true,sprint:10,count:true,warm:300,timer:300},workSets:2,repMin:6,repMax:10,warm:[{p:50,r:10},{p:80,r:5}],bw:null};
const SEED=[
['squat','Приседания со штангой','Ноги','barbell'],['front','Фронтальные приседания','Ноги','barbell'],['deadlift','Становая тяга','Спина','barbell'],
['rdl','Румынская тяга','Ноги','barbell'],['bench','Жим штанги лёжа','Грудь','barbell'],['incline','Жим штанги на наклонной скамье','Грудь','barbell'],
['ohp','Жим штанги стоя','Плечи','barbell'],['row','Тяга штанги в наклоне','Спина','barbell'],['hipthrust','Ягодичный мост со штангой','Ягодицы','barbell'],
['lunge','Выпады со штангой','Ноги','barbell'],['shrug','Шраги со штангой','Спина','barbell'],['cgbench','Жим лёжа узким хватом','Трицепс','barbell'],
['curl_ez','Подъём EZ-штанги на бицепс','Бицепс','barbell',{bar:'EZ'}],['french','Французский жим EZ-штанги','Трицепс','barbell',{bar:'EZ'}],
['uprow','Тяга EZ-штанги к подбородку','Плечи','barbell',{bar:'EZ'}],['wrist','Сгибание кистей со штангой','Предплечья','barbell',{bar:'EZ'}],
['bench_db','Жим гантелей лёжа','Грудь','dumbbell'],['incline_db','Жим гантелей на наклонной скамье','Грудь','dumbbell'],['fly_db','Разводка гантелей лёжа','Грудь','dumbbell'],
['row_db','Тяга гантели в наклоне','Спина','dumbbell',{two:false}],['ohp_db','Жим гантелей сидя','Плечи','dumbbell'],['lat_db','Махи гантелями в стороны','Плечи','dumbbell'],
['rear_db','Махи гантелями в наклоне','Плечи','dumbbell'],['curl_db','Подъём гантелей на бицепс','Бицепс','dumbbell'],['hammer','Молотки','Бицепс','dumbbell'],
['ohext_db','Разгибание гантели из-за головы','Трицепс','dumbbell',{two:false}],['bulg','Болгарские выпады с гантелями','Ноги','dumbbell'],
['goblet','Гоблет-приседания','Ноги','dumbbell',{two:false}],['shrug_db','Шраги с гантелями','Спина','dumbbell'],
['legpress','Жим ногами','Ноги','machine',{step:10,machine:'Жим ногами'}],['legext','Разгибание ног в тренажёре','Ноги','machine'],['legcurl','Сгибание ног в тренажёре','Ноги','machine'],
['latpull','Тяга верхнего блока','Спина','machine',{machine:'Верхний блок'}],['cablerow','Тяга горизонтального блока','Спина','machine',{machine:'Нижний блок'}],['chestpress','Жим от груди в тренажёре','Грудь','machine'],
['pecdeck','Сведение рук в тренажёре','Грудь','machine'],['crossover','Сведение в кроссовере','Грудь','machine',{step:2.5,machine:'Кроссовер'}],
['pushdown','Разгибание рук на блоке','Трицепс','machine',{step:2.5,machine:'Кроссовер'}],['cablecurl','Сгибание рук на нижнем блоке','Бицепс','machine',{step:2.5,machine:'Кроссовер'}],
['calf','Подъём на носки в тренажёре','Икры','machine'],['smithsq','Приседания в Смите','Ноги','machine',{machine:'Тренажёр Смита'}],
['kbswing','Махи гирей','Ягодицы','kettlebell',{warm:false}],['kbpress','Жим гири стоя','Плечи','kettlebell'],['kbgoblet','Гоблет-приседания с гирей','Ноги','kettlebell'],
['pullup','Подтягивания','Спина','bodyweight'],['dips','Отжимания на брусьях','Грудь','bodyweight'],['pushup','Отжимания от пола','Грудь','bodyweight'],
['hyper','Гиперэкстензия','Спина','bodyweight'],['legraise','Подъём ног в висе','Пресс','bodyweight'],['crunch','Скручивания','Пресс','bodyweight'],
];
function seedExercises(){ return SEED.map(([id,name,group,equip,extra])=>Object.assign({id:'x_'+id,name,group,equip,bar:equip==='barbell'?'Олимпийский':'',machine:'',two:true,step:5,start:null,rest:null,warm:equip!=='bodyweight',note:''},extra||{})); }
function seedGyms(){ const fixed=[];for(let w=2;w<=50;w+=2) fixed.push(w);
  return [
  {id:'g_d23',name:'D23',bars:[{name:'Олимпийский',w:20},{name:'EZ',w:10}],plates:[{w:25,n:2},{w:20,n:4},{w:15,n:2},{w:10,n:4},{w:5,n:4},{w:2.5,n:4},{w:1.25,n:4}],db:{mode:'plates',handle:2,plates:[{w:5,n:4},{w:2.5,n:8},{w:1.25,n:8}],fixed:''},machines:[],kb:'16, 24, 32'},
  {id:'g_ddx',name:'DDX',bars:[{name:'Олимпийский',w:20},{name:'EZ',w:10}],plates:[{w:25,n:8},{w:20,n:8},{w:15,n:4},{w:10,n:8},{w:5,n:8},{w:2.5,n:8},{w:1.25,n:4}],db:{mode:'fixed',handle:2,plates:[],fixed:fixed.join(', ')},machines:ddxMachines(),kb:'8, 12, 16, 20, 24, 28, 32'}];}
function ddxMachines(){ return [{id:'m1',name:'Верхний блок',type:'stack',step:5,min:5,max:100},{id:'m2',name:'Нижний блок',type:'stack',step:5,min:5,max:100},{id:'m3',name:'Кроссовер',type:'stack',step:2.5,min:2.5,max:50},{id:'m4',name:'Жим ногами',type:'plate',base:0,sides:2},{id:'m5',name:'Тренажёр Смита',type:'plate',base:15,sides:2}]; }
function freshState(){
  const T=(id,name,ids)=>({id,name,items:ids.map(i=>({exId:'x_'+i}))});
  return {v:2,_u:0,settings:clone(DEF_SETTINGS),gyms:seedGyms(),gymId:'g_d23',exercises:seedExercises(),
    templates:[T('t_a','Тренировка А',['squat','bench','row','ohp_db']),T('t_b','Тренировка Б',['deadlift','ohp','pullup','curl_ez']),T('t_c','Тренировка В',['legpress','incline','latpull','pushdown'])],
    nextTpl:'t_a',body:[],hint:true,mito:defMito()};
}
function migrate(s){ if(!s.mito||!Array.isArray(s.mito.profiles)||!s.mito.profiles.length) s.mito=defMito(); s.mito.profiles=s.mito.profiles.map(p=>{ if(p.v===2){ const d=defProfile('',p.age||40); for(const k in d) if(p[k]==null) p[k]=d[k]; return p; } return Object.assign(defProfile(p.name||'Профиль',p.age||40),{id:p.id,hrMax:p.hrMax||null}); }); if(!s.mito.profiles.some(p=>p.id===s.mito.active)) s.mito.active=s.mito.profiles[0].id; s.settings=Object.assign(clone(DEF_SETTINGS),s.settings||{}); s.settings.cardio=Object.assign(clone(DEF_SETTINGS.cardio),s.settings.cardio||{}); s.gyms=s.gyms||[]; s.exercises=s.exercises||[]; s.templates=s.templates||[]; s.body=s.body||[];
  s.gyms.forEach(g=>{ if(!Array.isArray(g.machines)) g.machines=g.id==='g_ddx'&&(s.v||1)<2?ddxMachines():[]; if(g.kb==null) g.kb=g.id==='g_ddx'?'8, 12, 16, 20, 24, 28, 32':''; g.machines.forEach(m=>{ if(!m.id) m.id='m'+uid(); }); });
  if((s.v||1)<2){ const seed=seedExercises(); seed.forEach(x=>{ const e=s.exercises.find(y=>y.id===x.id); if(e){ if(e.machine==null&&x.machine) e.machine=x.machine; } else if(['kettlebell'].includes(x.equip)||x.id==='x_smithsq') s.exercises.push(x); }); s.v=2; }
  s.exercises.forEach(e=>{ if(e.machine==null) e.machine=''; if(e.pre){ const ts=[s.templates.find(t=>t.id===s.nextTpl),...s.templates].filter(Boolean); const t=ts.find(t=>t.items.some(i=>i.exId===e.id)); if(t){ const it=t.items.find(i=>i.exId===e.id); if(!it.pre) it.pre=e.pre; } delete e.pre; } });
  return s; }

/* ---------- state ---------- */
let S=freshState(), SESS=[], ACT=null;
const UI={tab:'train',view:null,id:null,stack:[],seg:'over',exQ:'',exG:'',bodyMetric:'w',draft:null,calc:{gymId:null,kind:'bar',bar:0,w:100,two:true}};
const LS='ironlog.v1';
function lsGet(){ try{ return JSON.parse(localStorage.getItem(LS)||'null'); }catch(e){ return null; } }
function lsSet(){ try{ localStorage.setItem(LS,JSON.stringify({S,SESS,ACT})); }catch(e){} }

const exById=id=>S.exercises.find(x=>x.id===id);
const gymOf=id=>S.gyms.find(g=>g.id===id)||S.gyms[0]||{id:'none',name:'Зал',bars:[{name:'Олимпийский',w:20}],plates:[],db:{mode:'fixed',handle:2,plates:[],fixed:''}};
const exOf=e=>exById(e.exId)||{id:e.exId,name:e.name,equip:e.equip,group:e.group,two:e.two,bar:e.bar||'',machine:e.machine||'',step:e.step||5,warm:true};
const fin=()=>SESS.filter(s=>!s.del).sort((a,b)=>a.start-b.start);
function bwNow(){ const b=[...S.body].filter(x=>x.w).sort((a,c)=>a.d<c.d?1:-1)[0]; return b?b.w:(S.settings.bw||null); }
const isEx=(ex,w)=>(ex.excl||[]).some(x=>Math.abs(+x-w)<1e-9);
const avail=(arr,ex)=>(arr||[]).filter(p=>!isEx(ex,+p.w));
function platePool(ex,gym){ if(ex.equip==='barbell') return gym.plates||[]; if(ex.equip==='dumbbell'&&(gym.db||{}).mode!=='fixed') return (gym.db||{}).plates||[]; if(ex.equip==='machine'){ const m=machineFor(ex,gym); if(m&&m.type==='plate') return gym.plates||[]; } return null; }
function machineFor(ex,gym){ const n=(ex.machine||'').trim().toLowerCase(); if(!n) return null; return ((gym&&gym.machines)||[]).find(m=>(m.name||'').trim().toLowerCase()===n)||null; }
function barFor(ex,gym){ const bars=(gym&&gym.bars)||[]; const n=(ex.bar||'').trim().toLowerCase(); return bars.find(b=>(b.name||'').trim().toLowerCase()===n)||bars[0]||{name:'Гриф',w:20}; }

let OV=0; const OC=new Map();
function options(ex,gym){
  const key=OV+'|'+ex.id+'|'+ex.equip+'|'+(ex.bar||'')+'|'+(ex.machine||'')+'|'+ex.two+'|'+ex.step+'|'+(ex.excl||[]).join(',')+'|'+(gym&&gym.id);
  if(OC.has(key)) return OC.get(key);
  let list=[];
  if(ex.equip==='barbell'){ const bar=barFor(ex,gym); const ps=plateSums(avail(gym.plates,ex),2); list=[...ps.m.keys()].map(u=>r2(+bar.w+2*u/100)); }
  else if(ex.equip==='dumbbell'){ const d=gym.db||{}; if(d.mode==='fixed') list=parseList(d.fixed); else { const ps=plateSums(avail(d.plates,ex),ex.two===false?2:4); list=[...ps.m.keys()].map(u=>r2((+d.handle||0)+2*u/100)); } if(!list.length) for(let w=1;w<=60;w++) list.push(w); }
  else if(ex.equip==='machine'){ const m=machineFor(ex,gym);
    if(m&&m.type==='plate'){ const sd=m.sides===1?1:2; const ps=plateSums(avail(gym.plates,ex),sd); list=[...ps.m.keys()].map(u=>r2((+m.base||0)+sd*u/100)); }
    else if(m){ const st=+m.step||5, mn=+m.min||st, mx=Math.max(mn,+m.max||mn); for(let w=mn;w<=mx+1e-9;w+=st) list.push(r2(w)); }
    else { const st=+ex.step||5; for(let w=st;w<=400+1e-9;w+=st) list.push(r2(w)); } }
  else if(ex.equip==='kettlebell'){ list=parseList(gym.kb); if(!list.length) list=[8,12,16,20,24,28,32]; }
  else { for(let w=0;w<=100+1e-9;w+=1.25) list.push(r2(w)); }
  list=[...new Set(list)].sort((a,b)=>a-b); OC.set(key,list); return list;
}
function breakdown(ex,gym,w){
  const list=options(ex,gym); const near={lo:floorW(list,w),hi:upW(list,w)};
  const has=list.some(v=>Math.abs(v-w)<1e-9);
  if(ex.equip==='barbell'){ const bar=barFor(ex,gym); const u=Math.round((w-bar.w)/2*100); const side=u>=0?expandPlates(plateSums(avail(gym.plates,ex),2),u):null; return {kind:'bar',bar,ok:!!side,side:side||[],...near}; }
  if(ex.equip==='dumbbell'){ const d=gym.db||{}; if(d.mode==='fixed') return {kind:'fix',ok:has,...near}; const h=+d.handle||0; const u=Math.round((w-h)/2*100); const side=u>=0?expandPlates(plateSums(avail(d.plates,ex),ex.two===false?2:4),u):null; return {kind:'dbp',bar:{name:'Гриф гантели',w:h},ok:!!side,side:side||[],...near}; }
  if(ex.equip==='bodyweight') return {kind:'bw',ok:true,total:(bwNow()||0)+w};
  if(ex.equip==='kettlebell') return {kind:'kb',ok:has,...near};
  const m=machineFor(ex,gym);
  if(m&&m.type==='plate'){ const sd=m.sides===1?1:2; const u=Math.round((w-(+m.base||0))/sd*100); const side=u>=0?expandPlates(plateSums(avail(gym.plates,ex),sd),u):null; return {kind:'mplate',m,sd,bar:{name:m.name,w:+m.base||0},ok:!!side,side:side||[],...near}; }
  return {kind:'mach',m,ok:has,...near};
}

/* ---------- calculations over history ---------- */
const loadW=(e,w)=> e.equip==='bodyweight'? (e.bw||bwNow()||0)+w : w;
const setTon=(e,x)=> loadW(e,x.w)*x.r*((e.equip==='dumbbell'&&e.two!==false)?2:1);
const entryTon=(e,workOnly)=>e.sets.filter(x=>!workOnly||x.k==='w').reduce((t,x)=>t+setTon(e,x),0);
const sessTon=(s,workOnly)=>s.entries.reduce((t,e)=>t+entryTon(e,workOnly),0);
function entryE1(e){ let b=0; e.sets.forEach(x=>{ if(x.k==='w'&&x.r>0&&x.r<=12) b=Math.max(b,e1rm(loadW(e,x.w),x.r)); }); return b; }
function lastEntry(exId){ const f=fin(); for(let i=f.length-1;i>=0;i--){ const e=f[i].entries.find(e=>e.exId===exId&&e.sets.some(x=>x.k==='w')); if(e) return {e,s:f[i]}; } return null; }
function exHistory(exId,list){ return (list||fin()).map(s=>{ const e=s.entries.find(x=>x.exId===exId); if(!e) return null; const ws=e.sets.filter(x=>x.k==='w'); if(!ws.length) return null;
  const top=ws.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a); return {s,e,e1:entryE1(e),topW:top.w,topR:top.r,ton:entryTon(e)}; }).filter(Boolean); }

function buildEntry(ex,gym,pre){
  const st=S.settings, list=options(ex,gym), L=lastEntry(ex.id), nW=st.workSets;
  let W=null,kind='new',note='',last='',reps=Array(nW).fill(st.repMin);
  if(L){
    const ws=L.e.sets.filter(x=>x.k==='w');
    last=ws.map(x=>fmt(x.w)+'×'+x.r).join(', ')+' · '+dfmt(L.s.start);
    const bwv=L.e.bw||bwNow()||0, isBW=ex.equip==='bodyweight';
    const p=progress(list,ws,st,w=>isBW?bwv+w:w,w=>isBW?w-bwv:w);
    W=p.W; kind=p.kind; reps=p.reps;
    if(kind==='up') note=`${nW}×${st.repMax} выполнено. Новый вес на ${st.repMin} повторений: +${fmt(W-p.lw)} кг`;
    else if(kind==='down') note=`Было меньше ${st.repMin} повторений. Вес снижен на шаг: −${fmt(p.lw-W)} кг`;
    else note=`Тот же вес, добавляйте повторения. Цель ${nW}×${st.repMax}`;
  } else if(ex.start!=null){ W=floorW(list,ex.start); note=`Стартовый вес. Цель — ${st.repMin} повторений и выше`; }
  else if(ex.equip==='bodyweight'){ W=0; note='Нет истории. Вес — добавочный, 0 = без отягощения'; }
  else note=`Нет истории. Введите вес, с которым сделаете ${st.repMin} повторений`;
  if(pre&&pre.w!=null){ const calc=W; W=list.some(v=>Math.abs(v-pre.w)<1e-9)?pre.w:floorW(list,pre.w); kind='pre';
    note=`Вес задан заранее: ${fmt(W)} кг`+(calc!=null&&Math.abs(calc-W)>1e-9?` (по прогрессии было бы ${fmt(calc)} кг)`:''); if(pre.r) reps=Array(nW).fill(pre.r); }
  const sets=[];
  if(ex.warm!==false) st.warm.forEach(wu=>sets.push({k:'r',w:W!=null?floorW(list,W*wu.p/100):null,r:wu.r,done:false}));
  for(let i=0;i<nW;i++) sets.push({k:'w',w:W,r:reps[i]??st.repMin,done:false});
  return {id:uid(),exId:ex.id,name:ex.name,equip:ex.equip,group:ex.group,two:ex.two,bar:ex.bar,machine:ex.machine,step:ex.step,bw:ex.equip==='bodyweight'?bwNow():null,plan:{kind,note,last},sets,note:'',col:false};
}
function propagate(e,si){
  const ex=exOf(e), gym=gymOf(ACT.gymId), list=options(ex,gym), s=e.sets[si];
  if(s.k!=='w') return; const firstW=e.sets.findIndex(x=>x.k==='w'); if(si!==firstW) return;
  e.sets.forEach((x,i)=>{ if(x.done||i===si) return; if(x.k==='w') x.w=s.w; });
  let wi=0; e.sets.forEach(x=>{ if(x.k!=='r') return; const wu=S.settings.warm[wi++]; if(x.done||!wu||s.w==null) return; x.w=floorW(list,s.w*wu.p/100); });
}

/* ---------- persistence: phone (IndexedDB) ---------- */
let IDB=null, saveT=null, persisted=null;
function idbOpen(){ return new Promise(res=>{ try{ const r=indexedDB.open('ironlog',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>res(null); r.onblocked=()=>res(null); }catch(e){ res(null); } }); }
function idbGet(k){ return new Promise(res=>{ try{ const q=IDB.transaction('kv').objectStore('kv').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }catch(e){ res(undefined); } }); }
function flush(){ clearTimeout(saveT); saveT=null;
  if(IDB){ try{ const tx=IDB.transaction('kv','readwrite'), st=tx.objectStore('kv'); st.put(clone(S),'S'); st.put(clone(SESS),'SESS'); st.put(ACT?clone(ACT):null,'ACT'); st.put(clone({rec:CAR.rec||null,tm:CAR.tm||null}),'CARDIO'); st.put(MITO.run?clone(MITO.run):null,'MITO'); tx.onerror=()=>lsSet(); return; }catch(e){} }
  lsSet(); }
function persist(){ if(!saveT) saveT=setTimeout(flush,250); }
function saveState(){ S._u=Date.now(); OV++; OC.clear(); persist(); }
function saveSession(s){ s.u=Date.now(); persist(); }
function saveActive(now){ if(now) flush(); else persist(); }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden'&&saveT) flush(); });
window.addEventListener('pagehide',()=>{ if(saveT) flush(); });
async function askPersist(){ try{ if(navigator.storage&&navigator.storage.persist){ persisted=await navigator.storage.persisted(); if(!persisted) persisted=await navigator.storage.persist(); } }catch(e){} }
function backupDue(){ const n=S.settings.backupDays; if(!n) return false; const f=fin(); if(!f.length) return false; const lb=S.lastBackup||0; return f[f.length-1].start>lb && Date.now()-lb>n*864e5; }
function backupAgo(){ const lb=S.lastBackup; if(!lb) return 'копий ещё не было'; const d=Math.floor((Date.now()-lb)/864e5); return 'последняя копия '+(d===0?'сегодня':d+' '+plural(d,'день','дня','дней')+' назад'); }
function storageHtml(){ return `<div class="row wrap"><span class="badge ${persisted?'good':'bad'}">${persisted?'Хранение на телефоне защищено':'Браузер может очистить данные — делайте копии'}</span><span class="badge ${S.lastBackup&&!backupDue()?'good':'acc'}">${backupAgo()}</span></div>`; }
const backupBanner=()=>backupDue()?`<div class="banner"><div class="grow">Резервной копии не было больше ${S.settings.backupDays} ${plural(S.settings.backupDays,'дня','дней','дней')}. Сохраните её на Яндекс Диск.</div><button class="btn primary sm" data-a="exportJson" data-m="share">Сохранить</button></div>`:'';

/* ---------- sound, vibration, wake lock ---------- */
let AC=null;
function audio(){ try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function beep(f,d,at){ const ac=audio(); if(!ac) return; try{ const t=ac.currentTime+(at||0); const o=ac.createOscillator(),g=ac.createGain(); o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+0.05); }catch(e){} }
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
function signal(kind){ const m=S.settings.signal; if(m==='none') return;
  if(m==='both'){ if(kind==='pre') beep(880,.18,0); else { beep(1320,.28,0); beep(1320,.28,.4); beep(1760,.55,.8); } }
  vib(kind==='pre'?[180]:[500,200,500,200,900]); }
let WL=null, wlState='none';
async function wakeOn(){ if(!('wakeLock' in navigator)){ wlState='off'; updWL(); return; }
  try{ if(WL&&!WL.released){ wlState='on'; updWL(); return; } WL=await navigator.wakeLock.request('screen'); wlState='on'; WL.addEventListener('release',()=>{ wlState=document.visibilityState==='visible'&&ACT?'off':'none'; updWL(); }); }catch(e){ wlState='off'; } updWL(); }
function wakeOff(){ if(ACT||(typeof MITO!=='undefined'&&MITO.run&&!MITO.run.done)||(typeof CAR!=='undefined'&&CAR.rec)) return; try{ WL&&WL.release(); }catch(e){} WL=null; wlState='none'; }
function updWL(){ const el=$('#wl'); if(!el) return; el.className='wl '+(wlState==='on'?'on':'off'); el.textContent=wlState==='on'?'экран не гаснет':'экран может погаснуть — нажмите'; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(ACT||MITO.run||CAR.rec||UI.view==='cardio'||UI.view==='mito') wakeOn(); tick(); } });

/* ---------- heart rate (Bluetooth, standard Heart Rate Service) ---------- */
const HR={dev:null,bpm:null,last:0,state:'off',tries:0};
const ZC=['var(--muted)','var(--p-blue)','var(--p-green)','var(--accent)','var(--p-red)'];
const ZN=['Разминочная','Лёгкая','Аэробная','Пороговая','Максимальная'];
function hrZone(b){ const m=S.settings.hrMax; if(!m||!b) return -1; const p=b/m; return p<.6?0:p<.7?1:p<.8?2:p<.9?3:4; }
const hrFresh=()=>HR.bpm&&Date.now()-HR.last<6000;
async function hrConnect(){
  if(!navigator.bluetooth){ toast('Bluetooth недоступен. Откройте приложение в Chrome'); return; }
  try{ HR.state='connecting'; updHR();
    const dev=await navigator.bluetooth.requestDevice({filters:[{services:['heart_rate']}]});
    hrUse(dev); await hrAttach(); S.settings.hrName=dev.name||'Датчик'; S.settings.hrId=dev.id; saveState(); toast('Датчик подключён');
  }catch(e){ HR.state=HR.dev?'lost':'off'; if(e&&e.name!=='NotFoundError') toast('Не удалось подключиться. Наденьте датчик и намочите электроды'); updHR(); }
}
function hrUse(dev){ if(HR.dev===dev) return; HR.dev=dev; dev.addEventListener('gattserverdisconnected',()=>{ if(HR.state==='off') return; HR.state='lost'; updHR(); HR.tries=0; setTimeout(hrRetry,1500); }); }
async function hrAttach(){ const srv=await HR.dev.gatt.connect(); const svc=await srv.getPrimaryService('heart_rate'); const ch=await svc.getCharacteristic('heart_rate_measurement');
  ch.addEventListener('characteristicvaluechanged',onHr); await ch.startNotifications(); HR.state='on'; HR.tries=0; updHR(); }
async function hrRetry(){ if(!HR.dev||HR.state==='off'||HR.state==='on') return; try{ await hrAttach(); }catch(e){ if(++HR.tries<6) setTimeout(hrRetry,4000); else { HR.state='lost'; updHR(); } } }
async function hrAuto(){ // reconnect a known sensor without the chooser, where Chrome allows it
  try{ if(HR.dev||!S.settings.hrId||!navigator.bluetooth||!navigator.bluetooth.getDevices) return; const ds=await navigator.bluetooth.getDevices(); const d=ds.find(x=>x.id===S.settings.hrId); if(!d) return; hrUse(d); HR.state='connecting'; updHR(); await hrAttach(); }catch(e){ if(HR.state==='connecting'){ HR.state='off'; HR.dev=null; updHR(); } } }
function hrOff(){ HR.state='off'; try{ HR.dev&&HR.dev.gatt.connected&&HR.dev.gatt.disconnect(); }catch(e){} HR.dev=null; HR.bpm=null; updHR(); }
function onHr(ev){ const v=ev.target.value; const f=v.getUint8(0); const b=(f&1)?v.getUint16(1,true):v.getUint8(1); if(!b) return;
  HR.bpm=b; HR.last=Date.now(); cardioHr(b); mitoHr(b);
  if(ACT){ const h=ACT.hr||(ACT.hr={s:[]}); const t=Math.round((Date.now()-ACT.start)/1000); const l=h.s[h.s.length-1]; if(!l||t-l[0]>=5){ h.s.push([t,b]); saveActive(); }
    const tm=ACT.timer, lim=S.settings.hrRest; void 0; if(tm&&!tm.fired&&lim&&!tm.hrSig&&b<=lim&&Date.now()-(tm.end-tm.total*1000)>20000){ tm.hrSig=true; signal('pre'); const lb=$('#tmLabel'); if(lb) lb.textContent='Пульс восстановился до '+b; } }
  updHR(); }
function hrChip(){ const st=HR.state, b=hrFresh()?HR.bpm:null, z=hrZone(b);
  if(st==='on'&&b) return `<button class="hr on" id="hrChip" data-a="hrMenu" style="--zc:${z<0?'var(--p-red)':ZC[z]}"><span class="heart">♥</span><b>${b}</b>${z>=0?`<span>зона ${z+1}</span>`:''}</button>`;
  if(st==='connecting') return `<button class="hr" id="hrChip" data-a="hrMenu">♥ подключение…</button>`;
  if(st==='lost'||st==='on') return `<button class="hr warn" id="hrChip" data-a="hrMenu">♥ нет сигнала</button>`;
  return `<button class="hr" id="hrChip" data-a="hrConnect">♥ подключить пульс</button>`; }
function updHR(){ updCardio(); const c=$('#hrChip'); if(c) c.outerHTML=hrChip(); const t=$('#tmHr'); if(t) t.innerHTML=tmHr(); }
const tmHr=()=>hrFresh()?`<span style="color:${ZC[Math.max(0,hrZone(HR.bpm))]}">♥</span> ${HR.bpm}`:'';
function hrSummary(h,mx){ const M=mx||S.settings.hrMax; if(!h||!h.s||h.s.length<2) return null; const v=h.s.map(x=>x[1]); const z=[0,0,0,0,0];
  for(let i=1;i<h.s.length;i++){ const dt=Math.min(30,h.s[i][0]-h.s[i-1][0]); const pc=M?h.s[i][1]/M:0; const k=!M?-1:pc<.6?0:pc<.7?1:pc<.8?2:pc<.9?3:4; if(k>=0) z[k]+=dt; }
  const ds=[]; let lt=-99; h.s.forEach(x=>{ if(x[0]-lt>=10){ ds.push(x); lt=x[0]; } });
  return {avg:Math.round(v.reduce((a,b)=>a+b,0)/v.length),max:Math.max(...v),min:Math.min(...v),z,hrMax:M||null,s:ds}; }

/* ---------- cardio: heart-rate thresholds (aerobike sprints) ---------- */
const CAR={tm:null,armUp:true,armDown:false,state:null,lowAt:null,hiAt:null,sp:null,spT:null,rec:null};
const cs=()=>S.settings.cardio;
function cSig(kind){ const c=cs();
  if(kind==='hi'){ beep(1760,.22,0); beep(1760,.22,.3); beep(1760,.4,.6); if(c.vib) vib([300,120,300,120,300]); }
  else if(kind==='lo'){ beep(660,.35,0); beep(520,.5,.45); if(c.vib) vib([600,200,600]); }
  else if(kind==='tick') beep(1000,.12,0);
  else if(kind==='tmEnd'){ beep(1320,.25,0); beep(1320,.25,.35); beep(1760,.7,.7); if(c.vib) vib([500,200,500,200,800]); }
  else if(kind==='go'){ beep(1500,.6,0); if(c.vib) vib(400); }
  else if(kind==='stop'){ beep(880,.25,0); beep(880,.25,.3); beep(660,.5,.6); if(c.vib) vib([400,150,400]); } }
function cardioHr(b){ if(UI.view!=='cardio'&&!CAR.rec) return; const c=cs(), now=Date.now(); const prev=CAR.state;
  CAR.state=b>=c.hi?'hi':b<=c.lo?'lo':'mid';
  if(warmOn()){ if(CAR.rec){ const t=Math.round((now-CAR.rec.start)/1000), ls=CAR.rec.s[CAR.rec.s.length-1]; if(!ls||t-ls[0]>=2){ CAR.rec.s.push([t,b]); persist(); } } if(prev!==CAR.state&&UI.view==='cardio') updCardio(); return; }
  if(b>=c.hi&&CAR.armUp){ CAR.armUp=false; CAR.armDown=true; CAR.hiAt=now; if(c.sigHi) cSig('hi');
    if(CAR.rec) CAR.rec.sp.push({t:Math.round((now-CAR.rec.start)/1000),peak:b,rec:null}); }
  if(b<=c.lo&&CAR.armDown){ CAR.armDown=false; CAR.armUp=true; CAR.lowAt=now; if(c.sigLo) cSig('lo');
    if(CAR.rec){ const l=CAR.rec.sp[CAR.rec.sp.length-1]; if(l&&l.rec==null) l.rec=Math.round((now-CAR.rec.start)/1000)-l.t; } }
  if(CAR.rec){ const l=CAR.rec.sp[CAR.rec.sp.length-1]; if(l&&l.rec==null&&b>l.peak) l.peak=b;
    const t=Math.round((now-CAR.rec.start)/1000), ls=CAR.rec.s[CAR.rec.s.length-1]; if(!ls||t-ls[0]>=2){ CAR.rec.s.push([t,b]); persist(); } }
  if(prev!==CAR.state&&UI.view==='cardio') updCardio(); }
const warmOn=()=>!!(CAR.tm&&CAR.tm.warm&&!CAR.tm.done);
function tmStart(sec,label,warm){ CAR.tm={end:Date.now()+sec*1000,total:sec,label,warm:!!warm,paused:null,pre:false,done:false}; persist(); }
const tmLeft=()=>{ const t=CAR.tm; if(!t) return 0; return t.paused!=null?t.paused:Math.max(0,t.end-Date.now()); };
function tmTick(){ const t=CAR.tm; if(!t||t.paused!=null||t.done) return; const r=t.end-Date.now();
  if(!t.pre&&r<=10000&&r>0&&t.total>15){ t.pre=true; cSig('tick'); }
  if(r<=0){ t.done=true; cSig('tmEnd'); if(t.warm){ cardioReset(); toast('Разминка окончена — можно рывок'); } persist(); if(UI.view==='cardio') render(); } }

  <div class="clk ${run&&t.paused==null?'run':''} ${t&&t.done?'end':''}"><span>${esc(lbl)}</span><b class="num" id="cTm">${fmtSec(Math.ceil(val/1000))}</b></div></div>
  <div class="tmctl">${!run?`<button data-a="ctAdj" data-d="-30" aria-label="Минус 30 секунд">−30</button><button class="go" data-a="ctStart">Старт ${fmtSec(c.timer)}</button><button data-a="ctAdj" data-d="30" aria-label="Плюс 30 секунд">+30</button>`
    :`<button data-a="ctAdd" data-d="-30" aria-label="Минус 30 секунд">−30</button><button class="go" data-a="${t.paused!=null?'ctResume':'ctPause'}">${t.paused!=null?'Продолжить':'Пауза'}</button><button data-a="ctAdd" data-d="30" aria-label="Плюс 30 секунд">+30</button><button data-a="ctReset" aria-label="Сбросить таймер">Сброс</button>`}</div>`; }
function updClocks(){ const a=$('#cTot'); if(a&&CAR.rec) a.textContent=fmtDur(Date.now()-CAR.rec.start); const b=$('#cTm'); if(b&&CAR.tm&&!CAR.tm.done) b.textContent=fmtSec(Math.ceil(tmLeft()/1000)); }

function sprintStart(){ const c=cs(); audio(); if(CAR.spT) clearInterval(CAR.spT); const t0=Date.now()+3000; CAR.sp={go:t0,end:t0+c.sprint*1000,last:null};

function sprintHtml(){ const sp=CAR.sp, c=cs(), now=Date.now();

setInterval(()=>{ tmTick(); if(UI.view==='cardio'){ updClocks(); updCardio(); } },500);

/* ---------- mitochondria protocol v2 (aerobike, revised by research) ---------- */
const MITO={run:null};
const MTYPES={A:'Спринты',B:'Аэробная',T:'Тесты',SE:'Скоростная выносливость'};
function defPlan(age){ const r1=age>=45?75:60, r2=age>=45?90:75;
  const A=(series,sets,work,rest)=>({series,sets,work,rest});
  return [
    {a:A(2,5,8,r1),b:{type:'z2',min:30,reps:4,work:4,rest:3},deload:false,tests:false,se:false},
    {a:A(2,6,8,r1),b:{type:'z2',min:35,reps:4,work:4,rest:3},deload:false,tests:false,se:false},
    {a:A(3,6,8,r1),b:{type:'z2',min:40,reps:4,work:4,rest:3},deload:false,tests:false,se:false},
    {a:A(2,5,8,r1),b:{type:'z2',min:25,reps:4,work:4,rest:3},deload:true,tests:true,se:false},
    {a:A(3,6,10,r2),b:{type:'int',min:30,reps:4,work:4,rest:3},deload:false,tests:false,se:false},
    {a:A(3,8,10,r2),b:{type:'z2',min:40,reps:4,work:4,rest:3},deload:false,tests:false,se:true},
    {a:A(4,6,10,r2),b:{type:'int',min:30,reps:5,work:4,rest:3},deload:false,tests:false,se:true},
    {a:A(2,6,10,Math.max(r2,90)),b:{type:'z2',min:30,reps:4,work:4,rest:3},deload:true,tests:true,se:false}]; }
function defProfile(name,age){ return {v:2,id:'p'+uid(),name,age,hrMax:null,warm:480,cool:300,between:300,byHr:false,recHi:70,hrStop:80,pDrop:15,mode:'count',nA:1,nB:1,week:1,doneA:0,doneB:0,plan:defPlan(age)}; }
function defMito(){ const p=defProfile('Мой профиль',52); return {profiles:[p],active:p.id}; }
const mp=()=>{ const m=S.mito; return m.profiles.find(p=>p.id===m.active)||m.profiles[0]; };
const mHrMax=p=>p.hrMax||Math.round(208-0.7*p.age);
const mPct=(p,x)=>Math.round(mHrMax(p)*x/100);
const mAvg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
function mSig(k){ if(MITO.run&&MITO.run.muted) return; cSig(k); }

function mBuild(p,type,w,opts){ const st=[]; const pc=x=>mPct(p,x);
  st.push({ph:'warm',sec:type==='B'?Math.min(p.warm,300):type==='T'?600:p.warm,lbl:'Разминка',hint:type==='A'||type==='T'||type==='SE'?'Лёгкое кручение, в конце 2–3 разгона на 50–70%':'Лёгкое кручение'});
  if(type==='A'){ const a=w.a; for(let se=1;se<=a.series;se++){ for(let n=1;n<=a.sets;n++){ st.push({ph:'work',sec:a.work,se,n,S:a.series,N:a.sets,lbl:'РАБОТА',hint:'Почти максимум · RPE 9–10'}); if(n<a.sets) st.push({ph:'rest',sec:a.rest,lbl:'Отдых · лёгкое кручение'}); } if(se<a.series) st.push({ph:'between',sec:p.between,lbl:'Отдых между сериями',hint:'Пусть дыхание успокоится'}); } }
  if(type==='SE'){ for(let n=1;n<=4;n++){ st.push({ph:'work',sec:20,se:1,n,S:1,N:4,lbl:'РАБОТА',hint:'Мощно, держать темп все 20 с'}); if(n<4) st.push({ph:'rest',sec:210,lbl:'Отдых · лёгкое кручение'}); } }
  if(type==='B'){ const b=w.b; if(b.type==='z2') st.push({ph:'steady',sec:b.min*60,lbl:'Зона 2',zone:[pc(65),pc(75)],hint:'Ровно, можно говорить фразами'});
    else for(let i=1;i<=b.reps;i++){ st.push({ph:'steady',sec:b.work*60,lbl:`Интервал ${i} из ${b.reps}`,zone:[pc(85),pc(90)],hint:'Тяжело, но ровно все 4 минуты'}); if(i<b.reps) st.push({ph:'rest',sec:b.rest*60,lbl:'Отдых · лёгкое кручение'}); } }
  if(type==='T'){ const o=opts||{fix:true,rsa:true,max:true};
    if(o.fix) st.push({ph:'steady',sec:600,test:'fix',lbl:'Тест 1 · 10 мин на пульсе',zone:[pc(70),pc(75)],hint:'Держите пульс в коридоре. Запомните средние ватты за последние 5 минут'});
    if(o.fix&&(o.rsa||o.max)) st.push({ph:'between',sec:180,lbl:'Отдых'});
    if(o.rsa) for(let n=1;n<=8;n++){ st.push({ph:'work',sec:8,se:1,n,S:1,N:8,test:'rsa',lbl:'СПРИНТ',hint:'Всё, что есть · all-out'}); if(n<8) st.push({ph:'rest',sec:52,lbl:'Отдых · запишите ватты'}); }
    if(o.rsa&&o.max) st.push({ph:'between',sec:300,lbl:'Отдых перед последним тестом'});
    if(o.max) st.push({ph:'steady',sec:300,test:'max',lbl:'Тест 3 · 5 минут на максимум',hint:'Ровно и максимально. Запомните средние ватты или калории'}); }

const mStep=()=>{ const r=MITO.run; return r&&r.steps[r.idx]; };
function mEnter(i){ const r=MITO.run, now=Date.now(); r.tr=null; r.idx=i; const s=r.steps[i]; if(!s){ mDone(); return; }
  r.t0=now; r.t1=now+s.sec*1000; r.lastTick=null; r.zs={out:null,since:now,sig:null};
  if(s.ph==='work'){ const b=hrFresh()?HR.bpm:null; r.recs.push({se:s.se,n:s.n,test:s.test||null,t:Math.round((now-r.start)/1000),startMs:now,endT:null,restSec:null,peak:b,hrRest:null,drop:null,wait:r.waitAcc||0,w:null,burn:false}); r.waitAcc=0; mSig('go'); }
  else if(s.ph==='steady') mSig('go');
  persist(); if(UI.view==='mito') render(); }
function mDone(){ const r=MITO.run; r.done=true; r.doneAt=Date.now()-r.start; r.tr=null; r.idx=r.steps.length; mSig('tmEnd'); persist(); if(UI.view==='mito') render(); }
function mEndStep(){ const r=MITO.run, s=mStep(), now=Date.now(); if(!s){ mDone(); return; }
  const nx=r.steps[r.idx+1];
  if(s.ph==='work'){ const rc=r.recs[r.recs.length-1]; if(rc){ rc.endT=now; rc.restSec=nx&&nx.ph==='rest'?nx.sec:null; if(!rc.restSec) rc.hrRest=-1; } mSig('stop'); }
  else if(s.ph==='steady') mSig('tmEnd');
  if(s.ph==='rest'&&(r.type==='A'||r.type==='SE')&&!r.warnStop&&hrFresh()&&HR.bpm>r.hrStop){ r.warnStop=HR.bpm; mSig('hi'); }
  if(nx&&nx.ph==='work'&&s.ph==='rest'&&r.byHr&&hrFresh()&&HR.bpm>r.recHi){ r.tr={k:'wait',start:now}; persist(); if(UI.view==='mito') render(); return; }
  mEnter(r.idx+1); }
function mZone(s,now){ const r=MITO.run, z=r.zs; if(!hrFresh()) return; const b=HR.bpm; const out=b>s.zone[1]?'hi':b<s.zone[0]?'lo':null;
  if(now-r.t0>30000){ r.zt=(r.zt||0)+(out?0:.2); r.zn=(r.zn||0)+.2; }
  if(out!==z.out){ z.out=out; z.since=now; if(UI.view==='mito') render(); }
  if(out&&z.sig!==out&&now-z.since>=8000&&now-r.t0>30000){ z.sig=out; mSig(out); }
  if(!out) z.sig=null; }
function mTick(){ const r=MITO.run; if(!r||r.done||r.paused!=null) return; const now=Date.now();
  const rc=r.recs[r.recs.length-1];
  if(rc&&rc.endT&&rc.hrRest==null&&rc.restSec&&now-rc.endT>=rc.restSec*1000){ rc.hrRest=hrFresh()?HR.bpm:-1; if(rc.hrRest>0&&rc.peak) rc.drop=rc.peak-rc.hrRest; persist(); }
  if(r.tr){ if(r.tr.k==='wait'){ if(!hrFresh()||HR.bpm<=r.recHi){ r.waitAcc=Math.round((now-r.tr.start)/1000); if(hrFresh()) mSig('lo'); r.tr={k:'ready',end:now+3000}; r.lastTick=null; persist(); if(UI.view==='mito') render(); } else updMito(); return; }
    const sec=Math.ceil((r.tr.end-now)/1000); if(sec>0&&sec!==r.lastTick){ r.lastTick=sec; mSig('tick'); } if(now>=r.tr.end) mEnter(r.idx+1); else updMito(); return; }
  const s=mStep(); if(!s) return;
  const rem=r.t1-now, sec=Math.ceil(rem/1000), nx=r.steps[r.idx+1];
  if(rem>0&&sec!==r.lastTick){ const intoWork=nx&&nx.ph==='work'&&s.ph!=='work';
    if(sec<=3&&(s.ph==='work'||intoWork)){ r.lastTick=sec; mSig('tick'); }
    else if(sec===10&&s.sec>15){ r.lastTick=sec; mSig('tick'); } }
  if(s.ph==='steady'&&s.zone) mZone(s,now);
  if(rem<=0) mEndStep(); else updMito(); }
setInterval(mTick,200);
function mitoHr(b){ const r=MITO.run; if(!r||r.done) return; const now=Date.now();
  const t=Math.round((now-r.start)/1000), l=r.s[r.s.length-1]; if(!l||t-l[0]>=2){ r.s.push([t,b]); persist(); }
  const rc=r.recs[r.recs.length-1]; if(rc&&(rc.hrRest==null||now-rc.startMs<40000)&&(rc.peak==null||b>rc.peak)) rc.peak=b;
  const s=mStep();
  if(s&&s.test==='max'){ r.res.maxHr=Math.max(r.res.maxHr||0,b); }
  if(s&&s.test==='fix'&&now-r.t0>=(s.sec-300)*1000){ r.res.fixSum=(r.res.fixSum||0)+b; r.res.fixN=(r.res.fixN||0)+1; }
  updMito(); }
function mBigTxt(){ const r=MITO.run, now=Date.now(); if(r.done) return fmtDur(r.doneAt); if(r.paused!=null) return fmtSec(Math.ceil(r.paused/1000));
  if(r.tr) return r.tr.k==='wait'?'+'+fmtSec((now-r.tr.start)/1000):String(Math.max(1,Math.ceil((r.tr.end-now)/1000)));
  return fmtSec(Math.ceil(Math.max(0,r.t1-now)/1000)); }
function mDesc(s){ if(!s) return ''; if(s.ph==='work') return s.test==='rsa'?`спринт ${s.n} из ${s.N}`:`серия ${s.se} из ${s.S}, подход ${s.n} из ${s.N}`; if(s.ph==='cool') return 'заминка'; return s.lbl.toLowerCase(); }
function mProgTxt(){ const r=MITO.run; if(r.done){ const n=r.recs.filter(x=>x.endT).length; return n?`Выполнено подходов: ${n}`:'Время: '+durTxt(r.doneAt); }
  const s=mStep(), nx=r.steps[r.idx+1]; if(r.tr) return 'Дальше: '+mDesc(nx);
  if(s.ph==='work') return s.test==='rsa'?`Спринт ${s.n} из ${s.N}`:`Серия ${s.se} из ${s.S} · подход ${s.n} из ${s.N}`;
  return nx?'Дальше: '+mDesc(nx):'Последний этап'; }
function mLastTxt(){ const r=MITO.run, ls=[...r.recs].reverse().find(s=>s.endT); if(!ls) return '';
  return `${ls.test==='rsa'?'Спринт '+ls.n:'Подход '+ls.se+'.'+ls.n}: пик пульса <b>${ls.peak??'—'}</b>${ls.drop!=null?` · за ${ls.restSec} с упал на <b>${ls.drop}</b>`:''}`; }
function mHrColor(){ const r=MITO.run, s=mStep(); if(!hrFresh()) return ''; const b=HR.bpm;
  if(s&&s.ph==='steady'&&s.zone) return b>s.zone[1]?'var(--bad)':b<s.zone[0]?'var(--p-blue)':'var(--good)';
  return b>r.hrStop?'var(--bad)':'var(--fg)'; }
function updMito(){ const r=MITO.run; if(!r||UI.view!=='mito') return;
  const a=$('#mBig'); if(a) a.textContent=mBigTxt(); const t=$('#mTot'); if(t) t.textContent=fmtDur(r.done?r.doneAt:Date.now()-r.start);
  const h=$('#mHrv'); if(h){ h.textContent=hrFresh()?HR.bpm:'—'; h.style.color=mHrColor(); }
  const l=$('#mLast'); if(l) l.innerHTML=mLastTxt(); }
function mDropPct(){ const r=MITO.run; if(r.type!=='A') return null; const ls=[...r.recs].reverse().find(x=>x.endT); if(!ls||ls.w==null) return null;
  const same=r.recs.filter(x=>x.se===ls.se&&x.w!=null); if(same.length<2) return null; const best=Math.max(...same.map(x=>x.w)); const d=Math.round((1-ls.w/best)*100); return d>=r.pDrop?d:null; }
function mSeriesLeft(){ const r=MITO.run; for(let j=r.idx;j<r.steps.length;j++){ const s=r.steps[j]; if(s.ph==='between'||s.ph==='cool') return false; if(s.ph==='work') return true; } return false; }
function mEndSeries(){ const r=MITO.run; let j=r.idx; while(j<r.steps.length&&r.steps[j].ph!=='between'&&r.steps[j].ph!=='cool') j++; r.paused=null; mEnter(j); }

function mTests(pid){ return fin().filter(s=>s.kind==='mito'&&s.v===2&&s.type==='T'&&s.profileId===pid); }
function mTargets(p){ const T=mTests(p.id).reverse(); const rs=T.find(s=>s.res&&s.res.rsaBest), fx=T.find(s=>s.res&&s.res.fixW);
  return {sprintW:rs?Math.round(rs.res.rsaBest*0.9):null,rsaBest:rs?rs.res.rsaBest:null,rsaDate:rs?rs.start:null,z2W:fx?fx.res.fixW:null,z2Hr:fx?fx.res.fixHr:null,z2Date:fx?fx.start:null}; }
function mCompare(a,b){ // a = earlier test, b = later; returns {cmp:n, better:[...], worse:[...]}
  const A=a.res||{}, B=b.res||{}, out={cmp:0,better:[],same:[]};
  const chk=(name,x,y,up,th)=>{ if(x==null||y==null) return; out.cmp++; const d=up?(y-x)/x*100:(x-y); if(d>=th) out.better.push(name); else out.same.push(name); };
  chk('ватты на пульсе',A.fixW,B.fixW,true,2); chk('падение мощности в спринтах',A.rsaDec,B.rsaDec,false,1); chk('средние ватты в спринтах',A.rsaMean,B.rsaMean,true,2);
  chk('5 минут (ватты)',A.maxW,B.maxW,true,2); chk('5 минут (калории)',A.maxCal,B.maxCal,true,2); return out; }
function mAdvice(p){ const T=mTests(p.id); if(T.length<2) return null; const last=T[T.length-1], prev=T[T.length-2];

    tg:mTargets(p),hrMax:mHrMax(p),hrStop:mPct(p,p.hrStop),recHi:mPct(p,p.recHi),byHr:p.byHr,pDrop:p.pDrop,muted:false,paused:null,tr:null,waitAcc:0};

function mSave(counted){ const r=MITO.run; if(!r) return; const p=S.mito.profiles.find(x=>x.id===r.pid);

    week:r.week,deload:r.deload,desc:r.desc,hrMax:r.hrMax,hrStop:r.hrStop,recs,res,warnStop:r.warnStop||null,zonePct:r.zn?Math.round(100*(r.zt||0)/r.zn):null,counted:!!counted};

function viewMitoGuide(){ const p=mp(); const sec=(h,t)=>`<section class="card"><h3>${h}</h3>${t}</section>`;
  const b=sec('Зачем это борцу','<p>Цель — больше митохондрий в мышцах: позже закисляетесь, дольше держите темп, быстрее восстанавливаетесь между взрывными действиями в схватке.</p>')

function restAfter(ei,si){ const e=ACT.entries[ei], s=e.sets[si], nx=e.sets[si+1], st=S.settings, ex=exById(e.exId);
  if(nx){ if(s.k==='r'&&nx.k==='r') return st.restWarm; if(s.k==='r') return st.restAfterWarm; return (ex&&ex.rest)||st.restWork; }
  return ACT.entries.slice(ei+1).some(x=>x.sets.some(y=>!y.done))? st.restNext : 0; }
function startRest(sec,label){ if(!sec){ return; } ACT.timer={end:Date.now()+sec*1000,total:sec,label,pre:false,fired:false}; renderTimer(); }
function renderTimer(){ const el=$('#timer'); const t=ACT&&ACT.timer; document.body.classList.toggle('has-timer',!!t);
  if(!t){ el.hidden=true; el.innerHTML=''; return; }
  el.hidden=false;
  el.innerHTML=`<div class="tm ${t.fired?'end':''}" role="timer"><div class="tm-top"><span id="tmLabel">${t.fired?'Отдых окончен — подход!':esc(t.label)}</span><span id="tmHr" class="num" style="font-size:17px;font-weight:600">${tmHr()}</span><span>${fmtSec(t.total)}</span></div>
  <div class="tm-main"><button class="tm-b" data-a="tmAdd" data-d="-30" aria-label="Минус 30 секунд">−30</button><div class="tm-time" id="tmTime">${fmtSec(Math.ceil(Math.max(0,t.end-Date.now())/1000))}</div><button class="tm-b" data-a="tmAdd" data-d="30" aria-label="Плюс 30 секунд">+30</button></div>
  <div class="tm-bar"><i id="tmBar"></i></div><button class="btn primary wide" data-a="tmSkip">${t.fired?'Готово':'Пропустить отдых'}</button></div>`;
  tick(); }
function tick(){ if(!ACT) return; const now=Date.now(); const e=document.getElementById('elapsed'); if(e) e.textContent=fmtDur(now-ACT.start);
  const t=ACT.timer; if(!t) return; const rem=Math.max(0,t.end-now), sec=Math.ceil(rem/1000);
  const te=document.getElementById('tmTime'); if(te) te.textContent=fmtSec(sec);
  const b=document.getElementById('tmBar'); if(b) b.style.width=(100*rem/(t.total*1000))+'%';
  if(!t.pre&&sec<=S.settings.pre&&sec>0&&t.total>S.settings.pre){ t.pre=true; if(S.settings.pre>0) signal('pre'); }
  if(!t.fired&&rem<=0){ t.fired=true; t.firedAt=now; if(now-t.end<15000) signal('end'); renderTimer(); saveActive(); }
  if(t.fired&&now-(t.firedAt||now)>120000){ ACT.timer=null; renderTimer(); saveActive(); } }

function plateColor(w){ const m={25:'red',20:'blue',15:'yellow',10:'green',5:'white',2.5:'red',2:'blue',1.5:'yellow',1.25:'chrome',1:'green',0.5:'white'}[w]||'grey';

function plateSvg(side,barName,barW){
  const W=340,H=150,cy=72,inner=128;
  const th=w=>6+Math.min(26,w*0.75), ht=w=>w>=10?118:w>=5?86:w>=2.5?66:w>=1.25?52:44;

  let out=`<rect x="6" y="${cy-4}" width="${W-12}" height="8" rx="3" fill="var(--p-grey)"/><rect x="${W/2-inner/2}" y="${cy-3}" width="${inner}" height="6" fill="var(--muted)"/>`;
  [1,-1].forEach(dir=>{ let x=W/2+dir*inner/2+dir*3; out+=`<rect x="${dir>0?x-3:x}" y="${cy-14}" width="3" height="28" rx="1" fill="var(--muted)"/>`;
    side.forEach(w=>{ const t=th(w)*k, h=ht(w); const [c]=plateColor(w); const rx=dir>0?x:x-t; out+=`<rect x="${rx}" y="${cy-h/2}" width="${t}" height="${h}" rx="2.5" fill="${c}" stroke="var(--p-ink)" stroke-opacity=".35"/>`; x+=dir*(t+2*k); }); });
  out+=`<text x="${W/2}" y="${H-6}" text-anchor="middle">${esc(barName)} · ${fmt(barW)} кг</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Схема блинов">${out}</svg>`;
}
function platesLine(ex,gym,w){
  if(w==null) return '';

    if(!b.ok) return `<span class="warn">Не собрать из ваших блинов · ближайшие ${fmt(b.lo)} / ${fmt(b.hi)}</span>`;
    if(!b.side.length) return `<span class="muted">${b.kind==='bar'?'пустой гриф':'пустой гриф гантели'}</span>`;
    return `<span class="muted">${b.kind==='bar'?'на сторону':'на сторону гантели'}</span>${b.side.map(plateChip).join('')}`;
  }
  if(b.kind==='mplate'){ if(!b.ok) return `<span class="warn">Не собрать из блинов зала · ${fmt(b.lo)} / ${fmt(b.hi)}</span>`; if(!b.side.length) return `<span class="muted">без блинов</span>`; return `<span class="muted">${b.sd===1?'на тренажёр':'на сторону'}</span>${b.side.map(plateChip).join('')}`; }
  if(b.kind==='kb') return b.ok?`<span class="muted">гиря ${fmt(w)} кг</span>`:`<span class="warn">Нет такой гири · ${fmt(b.lo)} / ${fmt(b.hi)}</span>`;
  if(b.kind==='fix') return b.ok?`<span class="muted">гантели по ${fmt(w)} кг</span>`:`<span class="warn">Нет таких гантелей · ${fmt(b.lo)} / ${fmt(b.hi)}</span>`;
  if(b.kind==='bw') return `<span class="muted">с весом тела: ${fmt(b.total,1)} кг</span>`;
  return b.ok?(b.m?`<span class="muted">${esc(b.m.name)}</span>`:''):`<span class="warn">${b.m?'Нет такого веса на «'+esc(b.m.name)+'»':'Шаг тренажёра '+fmt(ex.step)+' кг'} · ${fmt(b.lo)} / ${fmt(b.hi)}</span>`;
}
function plateDetail(ex,gym,w){
  const b=breakdown(ex,gym,w);
  if(b.kind==='bar'||b.kind==='dbp'){
    if(!b.ok) return `<p class="warn">Этот вес не собрать из блинов зала «${esc(gym.name)}».</p>`;
    return `<div class="diagram">${plateSvg(b.side,b.bar.name,b.bar.w)}</div>
    <p>${esc(b.bar.name)} ${fmt(b.bar.w)} кг + на каждую сторону: ${b.side.length?b.side.map(plateChip).join(' '):'ничего'}</p>
    ${b.kind==='dbp'&&ex.two!==false?'<p class="muted">Блины указаны для одной гантели. Соберите две одинаковые.</p>':''}`;
  }
  if(b.kind==='mplate'){ if(!b.ok) return `<p class="warn">Этот вес не собрать на «${esc(b.m.name)}» из блинов зала «${esc(gym.name)}».</p>`;
    return `<div class="diagram">${b.sd===2?plateSvg(b.side,b.m.name,+b.m.base||0):''}</div><p>${esc(b.m.name)}${b.m.base?' (собственный вес '+fmt(b.m.base)+' кг)':''} + ${b.sd===2?'на каждую сторону':'на тренажёр'}: ${b.side.length?b.side.map(plateChip).join(' '):'ничего'}</p>`; }
  if(b.kind==='kb') return b.ok?`<p>Возьмите гирю <b>${fmt(w)} кг</b>.</p>`:`<p class="warn">Гири ${fmt(w)} кг в этом зале нет.</p>`;
  if(b.kind==='fix') return b.ok?`<p>Возьмите гантели по <b>${fmt(w)} кг</b>.</p>`:`<p class="warn">Гантелей ${fmt(w)} кг в этом зале нет.</p>`;
  if(b.kind==='bw') return `<p>Добавочный вес ${fmt(w)} кг. С весом тела — ${fmt(b.total,1)} кг.</p>`;
  return b.m?`<p>${esc(b.m.name)}: плитки от ${fmt(b.m.min)} до ${fmt(b.m.max)} кг, шаг ${fmt(b.m.step)} кг.</p>${b.ok?'':`<p class="warn">Такого веса на тренажёре нет.</p>`}`:`<p>Тренажёр, шаг плиток ${fmt(ex.step)} кг. Привяжите упражнение к тренажёру зала, чтобы учитывать его диапазон.</p>`;
}

/* ---------- charts ---------- */
function niceTicks(mn,mx,n){ const span=mx-mn||1, s0=span/(n||4), mag=Math.pow(10,Math.floor(Math.log10(s0))), f=s0/mag; const st=(f<1.5?1:f<3?2:f<7?5:10)*mag; const out=[]; for(let v=Math.ceil(mn/st)*st;v<=mx+1e-9;v+=st) out.push(r2(v)); return out; }
function lineChart(pts,unit){
  if(!pts.length) return '';
  const W=340,H=180,pl=38,pr=14,pt=22,pb=24;
  const ys=pts.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys); if(mx-mn<1){ mn-=1; mx+=1; } const pd=(mx-mn)*.12; mn-=pd; mx+=pd;
  const X=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  let g=''; niceTicks(mn,mx,4).forEach(v=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmt(v,1)}</text>`; });
  const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
  const area=pts.length>1?`<path d="${path} L${X(pts.length-1)} ${H-pb} L${X(0)} ${H-pb} Z" fill="var(--accent)" fill-opacity=".14"/>`:'';
  const xi=[...new Set([0,Math.floor((pts.length-1)/2),pts.length-1])];
  let xl=''; xi.forEach(i=>{ xl+=`<text x="${X(i)}" y="${H-6}" text-anchor="${pts.length===1?'middle':i===0?'start':i===pts.length-1?'end':'middle'}">${esc(pts[i].x)}</text>`; });
  const li=pts.length-1, lx=X(li), ly=Y(pts[li].y);
  const dots=pts.length<=24?pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="2.5" fill="var(--accent)"/>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${area}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<circle cx="${lx}" cy="${ly}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><text class="v" x="${Math.min(lx,W-pr-2)}" y="${ly-10}" text-anchor="end">${fmt(pts[li].y,1)}${unit?' '+unit:''}</text>${xl}</svg>`;
}
function barChart(pts,fmtV){
  const W=340,H=170,pl=40,pr=8,pt=12,pb=24; const mx0=Math.max(...pts.map(p=>p.y),0); const ticks=niceTicks(0,mx0||1,3); const mx=Math.max(ticks[ticks.length-1],mx0)||1;
  const bw=(W-pl-pr)/pts.length, Y=v=>pt+(H-pt-pb)*(1-v/mx);
  let g=''; ticks.forEach(v=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${fmtV(v)}</text>`; });
  let b=''; pts.forEach((p,i)=>{ const h=H-pb-Y(p.y); if(p.y>0) b+=`<rect x="${pl+i*bw+bw*.18}" y="${Y(p.y)}" width="${bw*.64}" height="${h}" rx="3" fill="var(--accent)" fill-opacity="${i===pts.length-1?1:.6}"/>`; if(p.lbl) b+=`<text x="${pl+i*bw+bw/2}" y="${H-6}" text-anchor="middle">${esc(p.lbl)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${b}</svg>`;
}
function heatmap(sessions){
  const weeks=18, cell=14, gap=3, W=34+weeks*(cell+gap), H=7*(cell+gap)+18;
  const byDay={}; sessions.forEach(s=>{ const k=localDay(s.start); byDay[k]=(byDay[k]||0)+Math.max(1,sessTon(s)); });
  const vals=Object.values(byDay).sort((a,b)=>a-b); const q=p=>vals.length?vals[Math.floor((vals.length-1)*p)]:0;
  const lv=v=>!v?0:v<=q(.33)?.35:v<=q(.66)?.65:1;
  const start=monday(Date.now())-(weeks-1)*7*864e5; let out=''; const days=['Пн','','Ср','','Пт','','Вс'];
  days.forEach((d,i)=>{ if(d) out+=`<text x="0" y="${18+i*(cell+gap)+11}">${d}</text>`; });
  for(let w=0;w<weeks;w++){ for(let d=0;d<7;d++){ const ts=start+(w*7+d)*864e5; if(ts>Date.now()) continue; const v=byDay[localDay(ts)]; const o=lv(v);
      out+=`<rect x="${34+w*(cell+gap)}" y="${18+d*(cell+gap)}" width="${cell}" height="${cell}" rx="3" fill="${o?'var(--accent)':'var(--surface2)'}" fill-opacity="${o||1}"><title>${dfmt(ts)}${v?': '+ton(v):''}</title></rect>`; }
    const ts=start+w*7*864e5; const dt=new Date(ts); if(dt.getDate()<=7) out+=`<text x="${34+w*(cell+gap)}" y="11">${dt.toLocaleDateString('ru-RU',{month:'short'}).replace('.','')}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Календарь тренировок">${out}</svg>`;
}

function hrCard(h){ const tot=h.z.reduce((a,b)=>a+b,0);

function viewStats(){

  let b=segs;
  if(seg==='over'){
    const d30=Date.now()-30*864e5, l30=f.filter(s=>s.start>=d30);

    b+=`<section class="card"><div class="lbl">Календарь, 18 недель</div><div class="tbl-wrap">${heatmap(f)}</div></section>`;
    const wk=[]; const m0=monday(Date.now()); for(let i=11;i>=0;i--){ const st=m0-i*7*864e5; const t=f.filter(s=>s.start>=st&&s.start<st+7*864e5).reduce((a,s)=>a+sessTon(s),0); const d=new Date(st); wk.push({y:t,lbl:i%3===0?d.getDate()+'.'+pad(d.getMonth()+1):''}); }
    b+=`<section class="card"><div class="lbl">Тоннаж по неделям</div>${barChart(wk,v=>v>=1000?fmt(v/1000,1)+'т':fmt(v,0))}</section>`;
    const last=f.slice(-20); b+=`<section class="card"><div class="lbl">Тоннаж по тренировкам</div>${lineChart(last.map(s=>({x:dfmt(s.start),y:sessTon(s)})),'кг')}</section>`;
    const d28=Date.now()-28*864e5, cnt={}; f.filter(s=>s.start>=d28).forEach(s=>s.entries.forEach(e=>{ const g=(exById(e.exId)||{}).group||e.group||'Другое'; cnt[g]=(cnt[g]||0)+e.sets.filter(x=>x.k==='w').length; }));
    const gs=Object.entries(cnt).sort((a,c)=>c[1]-a[1]); const mx=Math.max(1,...gs.map(g=>g[1]));
    b+=`<section class="card"><div class="lbl">Рабочие подходы по мышцам, 28 дней</div>${gs.length?gs.map(([g,n])=>`<div class="hbar"><span>${esc(g)}</span><span><i style="width:${100*n/mx}%"></i></span><b>${n}</b></div>`).join(''):'<p class="muted">Нет подходов за этот период</p>'}</section>`;
  } else if(seg==='ex'){
    const ids=[...new Set(f.flatMap(s=>s.entries.map(e=>e.exId)))];
    const rows=ids.map(id=>{ const h=exHistory(id,f); if(!h.length) return null; const l=h[h.length-1], p=h.length>1?h[h.length-2]:null; return {id,name:(exById(id)||l.e).name,h,l,p}; }).filter(Boolean).sort((a,c)=>c.l.s.start-a.l.s.start);
    b+=`<section class="card"><div class="list">${rows.map(r=>{ const tr=r.p&&r.l.e1&&r.p.e1? (r.l.e1>r.p.e1+.05?'<span class="arrow-up">↑</span>':r.l.e1<r.p.e1-.05?'<span class="arrow-down">↓</span>':'='):'';
      return `<button class="li" data-a="go" data-v="exStat" data-id="${r.id}"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">${fmt(r.l.topW)} кг × ${r.l.topR} · ${dfmt(r.l.s.start)} · ${r.h.length} ${plural(r.h.length,'тренировка','тренировки','тренировок')}</div></div><div class="num" style="text-align:right;font-size:18px;font-weight:600">${r.l.e1?fmt(r.l.e1,1):'—'} ${tr}<div class="s" style="font-size:12px">1ПМ, кг</div></div><span class="chev">${IC.chev}</span></button>`; }).join('')}</div></section>`;
  } else {
    const ids=[...new Set(f.flatMap(s=>s.entries.map(e=>e.exId)))];
    b+=ids.map(id=>{ const h=exHistory(id,f); if(!h.length) return ''; const be=h.reduce((a,c)=>c.e1>a.e1?c:a), bw=h.reduce((a,c)=>c.topW>a.topW||(c.topW===a.topW&&c.topR>a.topR)?c:a), bt=h.reduce((a,c)=>c.ton>a.ton?c:a);

  }
  return {head:hdr('Прогресс'),body:b};
}

  <section class="card"><h3>Сохранить копию</h3><p class="muted">Файл со всеми данными: каталог, залы, шаблоны, ${f.length} ${plural(f.length,'тренировка','тренировки','тренировок')}, замеры. В меню отправки выберите «Диск», и файл ляжет на Яндекс Диск.</p><button class="btn primary wide" data-a="exportJson" data-m="share">Отправить на Яндекс Диск</button><button class="btn wide" data-a="exportJson" data-m="download">Сохранить в «Загрузки»</button></section>
  <section class="card"><h3>Восстановить</h3><p class="muted">Выберите файл копии. В окне выбора откройте «Диск», чтобы взять копию с Яндекс Диска. Текущие данные будут заменены.</p><button class="btn wide" data-a="importPick">Выбрать файл</button></section>

}
function viewHelp(){ return {head:hdr('Как пользоваться',{back:true}),body:`<section class="card"><h3>Иконка на рабочем столе</h3><p>Откройте адрес приложения в Chrome, нажмите ⋮ и выберите «Установить приложение» или «Добавить на главный экран». После первого открытия оно работает и без интернета.</p></section>
  <section class="card"><h3>Экран и таймер</h3><p>Во время тренировки приложение не даёт экрану погаснуть. В шапке видно состояние: «экран не гаснет». Если там написано другое, нажмите на надпись. Таймер считает от времени окончания, поэтому не сбивается, даже если вы переключились на другое приложение. Сигнал звучит только при открытом приложении.</p></section>
  <section class="card"><h3>Как идёт прогрессия</h3><p>Отметьте подход галочкой — запустится отдых. Вес и повторы меняйте кнопками ± или впишите вручную. Плюс и минус переходят к следующему весу, который можно собрать из ваших блинов. Если изменить вес первого рабочего подхода, второй и разминка пересчитаются сами. Чтобы удалить подход, нажмите на его номер слева.</p><p>Вес можно задать заранее, отдельно для каждого шаблона: на главном экране нажмите на упражнение в карточке следующей тренировки или на название другого шаблона.</p><p>Когда оба рабочих подхода сделаны по ${S.settings.repMax}, на следующей тренировке программа даст новый вес на ${S.settings.repMin} повторений.</p></section>
  <section class="card"><h3>Где хранятся данные</h3><p>Только в памяти телефона, никуда не отправляются. Если удалить приложение или очистить данные Chrome, записи пропадут, поэтому сохраняйте копию на Яндекс Диск: «Ещё → Резервная копия → Отправить на Яндекс Диск». Восстановить можно на любом телефоне.</p></section>`}; }
